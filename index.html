<!--
  套版比對台 · 多檔 PDF 差異檢查工具

  可自由使用、修改、分享。想改功能就直接編輯下面的程式碼。

  這個工具不會上傳你的檔案,也不記錄任何東西——PDF 只讀進記憶體,
  關掉分頁就消失。唯一的對外連線是開啟時去 cdnjs 抓 pdf.js 這個
  渲染函式庫;若要完全離線,把它下載到本機、改成相對路徑即可。

  內含 Mozilla pdf.js(Apache License 2.0)。
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>套版比對台 · 多檔 PDF 差異檢查</title>
<script src="pdf.min.js"></script>
<script src="pdf-lib.min.js"></script>
<style>
:root{
  --ink:#141920; --chrome:#1B222B; --raise:#232C37; --line:#303B48;
  --text:#E4EAF0; --muted:#8794A3;
  --mag:#D6296B; --cyan:#1E9EC9; --same:#6D7885;
  --font-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",-apple-system,system-ui,sans-serif;
  --font-mono:ui-monospace,"SF Mono",Menlo,Consolas,"Noto Sans Mono",monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--font-ui);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select{font:inherit;color:inherit}
.app{display:flex;flex-direction:column;height:100dvh}

.bar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:9px 14px;background:var(--chrome);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;white-space:nowrap}
.mark{width:15px;height:15px;flex:none;opacity:.9}
.group{display:flex;align-items:center;gap:7px}
.lab{font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.btn{background:var(--raise);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer;transition:border-color .15s,background .15s}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sq{width:28px;padding:5px 0;text-align:center;font-family:var(--font-mono)}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{background:var(--raise);border:0;padding:5px 11px;cursor:pointer;font-size:13px;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:#33414F;color:var(--text)}
select.pick,input.num{background:var(--raise);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
input.num{width:48px;text-align:center;font-family:var(--font-mono)}
.readout{font-family:var(--font-mono);font-size:12px;color:var(--muted);min-width:42px;text-align:center}
.zoombox{display:inline-flex;align-items:center;gap:2px;background:var(--raise);border:1px solid var(--line);border-radius:6px;padding:3px 7px}
.zoombox input{width:38px;background:transparent;border:0;padding:0;text-align:right;font-family:var(--font-mono);font-size:12px;color:var(--text);-moz-appearance:textfield}
.zoombox input::-webkit-outer-spin-button,.zoombox input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.zoombox .pctsign{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.zoombox.fit input{color:var(--muted)}
.pop{position:absolute;top:calc(100% + 6px);left:0;z-index:30;background:var(--chrome);border:1px solid var(--line);border-radius:8px;padding:10px;box-shadow:0 10px 30px rgba(0,0,0,.5);min-width:210px}
.poprow{display:flex;align-items:center;gap:7px}
.poprow+.poprow{margin-top:9px}
.poprow.end{justify-content:flex-end}
.pophint{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.5;font-family:var(--font-mono)}
.swatch{display:block;width:14px;height:14px;border-radius:3px;border:1px solid rgba(255,255,255,.35);background:#FF3B30;margin:0 auto}
.dot{width:20px;height:20px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
.dot[aria-pressed="true"]{border-color:#fff}
input[type=color]{width:32px;height:26px;padding:0;border:1px solid var(--line);border-radius:5px;background:var(--raise);cursor:pointer}
input[type=color]::-webkit-color-swatch-wrapper{padding:2px}
input[type=color]::-webkit-color-swatch{border:0;border-radius:3px}
input.num.hex{width:78px;text-transform:uppercase;font-size:12px}
.pop.wide{min-width:270px}
#inkSyms{flex-wrap:wrap;gap:4px}
.symbtn{width:30px;height:30px;border-radius:5px;border:1px solid var(--line);background:var(--raise);color:var(--text);cursor:pointer;font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center}
.symbtn:hover{border-color:var(--muted)}
.symbtn[aria-pressed="true"]{border-color:var(--cyan);background:#2C3A47}
.histlist{max-height:190px;overflow:auto;margin:8px 0;border:1px solid var(--line);border-radius:6px}
.histrow{display:flex;align-items:center;gap:8px;padding:5px 9px;cursor:pointer;font-size:12px;border-bottom:1px solid rgba(255,255,255,.05)}
.histrow:last-child{border-bottom:0}
.histrow:hover{background:#2C3A47}
.histrow.undone{opacity:.42}
.histrow .hdot{width:11px;height:11px;border-radius:3px;flex:none;border:1px solid rgba(255,255,255,.3)}
.histrow .hname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.histrow .hidx{font-family:var(--font-mono);font-size:10px;color:var(--muted);flex:none}
.ink{position:absolute;inset:0;z-index:3;pointer-events:none}
.pg canvas.ink{background:transparent}
.inkmode .scroll{cursor:crosshair}
.selmode .scroll{cursor:default}
.inkmode .pg{touch-action:none}
.switch{display:flex;align-items:center;gap:7px;cursor:pointer;user-select:none}
.switch input{appearance:none;width:32px;height:18px;border-radius:9px;background:#39434F;position:relative;cursor:pointer;transition:background .18s;margin:0}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--muted);transition:transform .18s,background .18s}
.switch input:checked{background:#1E5E75}
.switch input:checked::after{transform:translateX(14px);background:var(--cyan)}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

.stage{flex:1;min-height:0;position:relative}
.grid{display:grid;gap:1px;background:var(--line);height:100%;grid-auto-rows:minmax(0,1fr)}
.pane{background:var(--ink);display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
.pane.base{box-shadow:inset 0 0 0 1px var(--mag)}
.ph{display:flex;align-items:center;gap:6px;padding:4px 6px;background:var(--chrome);border-bottom:1px solid var(--line);flex:none}
.badge{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;padding:2px 5px;border-radius:3px;background:var(--raise);border:1px solid var(--line);cursor:pointer;color:var(--muted);flex:none}
.badge:hover{border-color:var(--muted);color:var(--text)}
.pane.base .badge{background:var(--mag);border-color:var(--mag);color:#fff}
.pname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
.pind{font-family:var(--font-mono);font-size:10px;color:var(--muted);flex:none}
.poff{width:34px;background:transparent;border:1px solid var(--line);border-radius:4px;padding:1px 2px;text-align:center;font-family:var(--font-mono);font-size:11px;flex:none;-moz-appearance:textfield}
.poff::-webkit-outer-spin-button,.poff::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.px{background:none;border:0;color:var(--muted);cursor:pointer;padding:0 3px;font-size:15px;line-height:1;flex:none}
.pfocus{background:none;border:0;color:var(--muted);cursor:pointer;padding:0 3px;font-size:13px;line-height:1;flex:none}
.pfocus:hover{color:var(--cyan)}
.pane.focused .pfocus{color:var(--cyan)}
.pane.hiddenPane{display:none !important}
.focusbar{display:flex;align-items:center;gap:8px;padding:3px 9px;border-radius:5px;background:#2C3A47;border:1px solid var(--cyan)}
.focusbar .lab{color:var(--cyan)}
.chips{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.chipbtn{font-family:var(--font-mono);font-size:11px;padding:3px 7px;border-radius:4px;
  background:var(--raise);border:1px solid var(--line);color:var(--muted);cursor:pointer}
.chipbtn:hover{border-color:var(--muted);color:var(--text)}
.chipbtn[aria-pressed="true"]{background:var(--cyan);border-color:var(--cyan);color:#06222C;font-weight:700}
.chipbtn.isbase{box-shadow:inset 0 -2px 0 var(--mag)}
.ver{font-family:var(--font-mono);font-size:9px;color:var(--muted);margin-left:5px;
  padding:1px 4px;border:1px solid var(--line);border-radius:3px;vertical-align:middle;font-weight:400}
.focushint{font-size:10px;color:var(--muted)}
.clearopt{display:block;width:100%;text-align:left;background:var(--raise);border:1px solid var(--line);border-radius:6px;padding:9px 11px;cursor:pointer;color:var(--text)}
.clearopt+.clearopt{margin-top:8px}
.clearopt:hover{border-color:var(--muted)}
.clearopt.danger:hover{border-color:var(--mag)}
.clearopt b{display:block;font-size:13px;font-weight:600;margin-bottom:3px}
.clearopt.danger b{color:#FF9BC1}
.clearopt small{display:block;font-size:11px;color:var(--muted);line-height:1.5}
.clearopt:disabled{opacity:.4;cursor:not-allowed}
.px:hover{color:var(--mag)}
.scroll{flex:1;overflow:auto;scrollbar-width:thin;cursor:grab}
.scroll.grabbing{cursor:grabbing}
.pages{position:relative;padding:12px;display:flex;flex-direction:column;align-items:center;align-items:safe center;gap:12px;min-width:max-content}
.pg{position:relative;background:#fff;box-shadow:0 4px 16px rgba(0,0,0,.35)}
.pg canvas{display:block;animation:fade .18s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}

.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;color:var(--muted);padding:30px}
.empty a{color:var(--cyan);text-decoration:underline;cursor:pointer}
.empty b{color:var(--text);font-size:16px}
.empty small{font-size:12px;max-width:420px;display:block}
.stage.over::after{content:"";position:absolute;inset:8px;border:1px dashed var(--cyan);border-radius:10px;background:rgba(30,158,201,.05);pointer-events:none}

.cell{background:var(--ink);display:flex;flex-direction:column;min-width:0;min-height:0}
.cellhead{display:flex;align-items:center;gap:6px;padding:4px 7px;background:var(--chrome);border-bottom:1px solid var(--line);font-size:12px;flex:none}
.cellhead .pname{font-size:12px}
.cellbody{flex:1;overflow:auto;padding:10px;display:flex;justify-content:center;justify-content:safe center;align-items:flex-start}
.frame{position:relative;background:#fff;box-shadow:0 4px 16px rgba(0,0,0,.35);flex:none}
.frame canvas{display:block}
.frame::before,.frame::after{content:"";position:absolute;width:10px;height:10px;border:0 solid var(--muted);opacity:.5;pointer-events:none}
.frame::before{top:-6px;left:-6px;border-top-width:1px;border-left-width:1px}
.frame::after{bottom:-6px;right:-6px;border-bottom-width:1px;border-right-width:1px}
.cellnote{margin:auto;font-size:12px;color:var(--muted);text-align:center;padding:12px}
.dpct{font-family:var(--font-mono);font-size:10px;color:var(--muted);margin-left:auto;flex:none}
.dpct.hit{color:var(--cyan)}

.status{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:7px 14px;background:var(--chrome);border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.legend{display:flex;align-items:center;gap:12px}
.key2{display:flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:11px}
.chip{width:15px;height:8px;border-radius:1px}
.spacer{flex:1}

.drawer{position:absolute;left:0;right:0;bottom:0;height:min(48%,360px);background:var(--chrome);border-top:1px solid var(--line);display:flex;flex-direction:column;box-shadow:0 -14px 34px rgba(0,0,0,.4)}
.drawerBar{display:flex;align-items:center;gap:10px;padding:7px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.drawerBody{flex:1;overflow:auto;padding:14px 16px;font-size:14px;line-height:2}
del,ins{text-decoration:none;padding:1px 3px;border-radius:3px}
del{background:rgba(214,41,107,.18);color:#FF9BC1;text-decoration:line-through;text-decoration-thickness:1px}
ins{background:rgba(30,158,201,.18);color:#8FDCF7}
.eq{color:var(--same)}
.toast{
  position:fixed;right:16px;bottom:52px;z-index:20;
  background:#2C3A47;border:1px solid var(--line);border-radius:7px;
  padding:8px 14px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.45);
  animation:pop .16s ease-out;
}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
[hidden]{display:none !important}
@media (max-width:760px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr)) !important}
  .pname{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>

<div class="app">
  <header class="bar">
    <div class="brand">
      <svg class="mark" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1"><circle cx="8" cy="8" r="4.2"/><path d="M8 0v4.5M8 11.5V16M0 8h4.5M11.5 8H16"/></svg>
      套版比對台<span class="ver" id="verTag" title="版本，用來確認有沒有更新成功">v9</span>
    </div>

    <input type="file" id="picker" accept="application/pdf,.pdf" multiple hidden>

    <div class="group">
      <span class="lab">檢視</span>
      <div class="seg" id="modeSeg">
        <button data-mode="side" aria-pressed="true">網格</button>
        <button data-mode="overlay" aria-pressed="false">疊圖</button>
      </div>
    </div>

    <div class="group" style="position:relative">
      <span class="lab">每列</span>
      <select class="pick" id="cols">
        <option value="auto">自動鋪滿</option>
        <option value="2">2 欄</option>
        <option value="3">3 欄</option>
        <option value="4">4 欄</option>
        <option value="5">5 欄</option>
        <option value="6">6 欄</option>
        <option value="custom" hidden>自訂</option>
      </select>
      <button class="btn sq" id="gridGear" title="自訂欄 × 列">
        <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.2"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v1.6M8 12.9v1.6M14.5 8h-1.6M3.1 8H1.5M12.6 3.4l-1.1 1.1M4.5 11.5l-1.1 1.1M12.6 12.6l-1.1-1.1M4.5 4.5L3.4 3.4"/></svg>
      </button>
      <div class="pop" id="gridPop" hidden>
        <div class="poprow"><span class="lab">欄</span><input class="num" type="number" id="gCols" min="1" max="12" value="2"><span class="lab">列</span><input class="num" type="number" id="gRows" min="1" max="12" value="1"></div>
        <div class="pophint" id="gHint"></div>
        <div class="poprow end"><button class="btn" id="gApply">套用</button></div>
      </div>
    </div>

    <div class="group">
      <span class="lab">縮放</span>
      <button class="btn sq" id="zoomOut">−</button>
      <span class="zoombox"><input type="number" id="zoomInput" min="10" max="600" step="5" title="輸入百分比,或按 + / −"><span class="pctsign">%</span></span>
      <button class="btn sq" id="zoomIn">＋</button>
      <button class="btn" id="zoomFit">符合寬度</button>
    </div>

    <label class="switch"><input type="checkbox" id="sync" checked><span class="lab">同步捲動</span></label>

    <div class="group" id="ovlNav" hidden>
      <span class="lab">基準頁</span>
      <button class="btn sq" id="pgPrev">‹</button>
      <input class="num" type="number" id="pgNum" value="1" min="1">
      <button class="btn sq" id="pgNext">›</button>
    </div>

    <button class="btn" id="textBtn">文字差異</button>
    <div class="group" style="position:relative">
      <span class="lab">標記</span>
      <div class="seg" id="inkSeg">
        <button data-ink="off" aria-pressed="true" title="關閉標記(可正常捲動)">關</button>
        <button data-ink="pen" aria-pressed="false" title="自由畫筆">筆</button>
        <button data-ink="hl" aria-pressed="false" title="螢光筆(半透明)">螢</button>
        <button data-ink="rect" aria-pressed="false" title="方框">框</button>
        <button data-ink="arrow" aria-pressed="false" title="箭頭">箭</button>
        <button data-ink="sym" aria-pressed="false" title="符號:圈圈、打勾、叉叉等">符</button>
        <button data-ink="text" aria-pressed="false" title="文字方塊:點一下即可打字">字</button>
        <button data-ink="sel" aria-pressed="false" title="選取:點一下選中標記,可拖曳移動、縮放、刪除">選</button>
      </div>
      <button class="btn sq" id="inkSymBtn" title="選符號" hidden><span id="inkSymCur">◯</span></button>
      <div class="pop" id="inkSymPop" hidden>
        <div class="poprow" id="inkSyms"></div>
        <div class="pophint">選好符號後,在頁面上點一下或拖曳決定大小。</div>
      </div>
      <button class="btn sq" id="inkColorBtn" title="顏色與粗細"><span id="inkSwatch" class="swatch"></span></button>
      <div class="pop" id="inkPop" hidden>
        <div class="poprow" id="inkColors"></div>
        <div class="poprow">
          <span class="lab">自訂</span>
          <input type="color" id="inkCustom" value="#FF3B30" title="點開挑任何顏色">
          <input class="num hex" type="text" id="inkHex" value="#FF3B30" maxlength="7" spellcheck="false" title="也可以直接輸入色碼,例如 #1E9EC9">
        </div>
        <div class="poprow"><span class="lab">粗細</span><input type="range" id="inkSize" min="1" max="20" value="3" style="flex:1"><span class="readout" id="inkSizeRead">3</span></div>
      </div>
      <button class="btn sq" id="inkUndo" title="上一步(Ctrl+Z)">↶</button>
      <button class="btn sq" id="inkRedo" title="下一步(Ctrl+Y)">↷</button>
      <button class="btn sq" id="inkHistBtn" title="歷程:一次跳回多步">☰</button>
      <div class="pop wide" id="inkHistPop" hidden>
        <div class="pophint" id="inkHistHint">尚無標記。</div>
        <div class="histlist" id="inkHistList"></div>
        <div class="poprow end"><button class="btn" id="inkClear" title="只清標記，不動 PDF 檔案">清除所有標記</button></div>
      </div>
    </div>
    <div class="group">
      <span class="lab">截圖</span>
      <button class="btn" id="shotCopy" title="把目前畫面複製成圖片">複製</button>
      <button class="btn" id="shotSave" title="把目前畫面存成 PNG">存 PNG</button>
      <button class="btn" id="exportPdf" title="把所有文件合併成一份 PDF,標記一併燒錄進去">匯出 PDF</button>
    </div>
    <div class="group" style="position:relative">
      <button class="btn" id="clearBtn" title="清除標記或清除檔案">清除 ▾</button>
      <div class="pop wide" id="clearPop" hidden>
        <button class="clearopt" id="clearInk">
          <b>清除標記</b>
          <small>只刪掉畫筆、螢光筆、框、箭頭、符號、文字<br>PDF 檔案留著，繼續比對</small>
        </button>
        <button class="clearopt danger" id="clearFiles">
          <b>清除檔案</b>
          <small>移除所有 PDF，回到空白畫面<br>標記也會一起消失</small>
        </button>
      </div>
    </div>
  </header>

  <main class="stage" id="stage">
    <div class="grid" id="grid"></div>
    <div class="grid" id="ovlGrid" hidden></div>
    <div class="empty" id="emptyState">
      <b>把 PDF 拖進來</b>
      <small>一次可放多份。第一份會自動當基準檔，其他都跟它比。點左上角的編號可以改指定基準。<br>也可以<a href="#" id="browseLink">點這裡選擇檔案</a>。檔案不會離開這台電腦。</small>
    </div>

    <aside class="drawer" id="drawer" hidden>
      <div class="drawerBar">
        <span class="lab">文字差異</span>
        <span class="lab">基準頁</span>
        <input class="num" type="number" id="diffPage" value="1" min="1">
        <span class="lab">對照</span>
        <select class="pick" id="diffTarget"></select>
        <button class="btn" id="diffRun">比對</button>
        <span class="spacer"></span>
        <span class="readout" id="diffMeta" style="min-width:auto"></span>
        <button class="btn sq" id="diffClose">×</button>
      </div>
      <div class="drawerBody" id="diffBody"></div>
    </aside>
  </main>

  <footer class="status">
    <div class="legend">
      <span class="key2"><span class="chip" style="background:var(--same)"></span>相同</span>
      <span class="key2"><span class="chip" style="background:var(--mag)"></span>只在基準</span>
      <span class="key2"><span class="chip" style="background:var(--cyan)"></span>只在對照</span>
    </div>
    <div class="focusbar" id="focusBar" hidden>
      <span class="lab">只看</span>
      <span class="focushint">可複選</span>
      <div class="chips" id="focusChips"></div>
      <button class="btn" id="focusAll" title="回到全部顯示(Esc)">全部</button>
      <span class="lab" id="focusInfo"></span>
    </div>
    <div class="spacer"></div>
    <div id="statusText">尚未載入檔案。</div>
  </footer>
  <div class="toast" id="toast" hidden></div>
</div>

<script>
(function(){
"use strict";
var pdfjsLib = window.pdfjsLib;
if(pdfjsLib){ pdfjsLib.GlobalWorkerOptions.workerSrc = "pdf.worker.min.js"; }

var $ = function(id){ return document.getElementById(id); };
var clamp = function(v,a,b){ return Math.max(a, Math.min(b, v)); };
var MAX = 12;

var docs = [];
var state = { mode:"side", zoom:"fit", cols:"auto", sync:true, baseId:null, page:1, gridCols:2, gridRows:1, focus:[] };
var uid = 0;

function setStatus(t){ $("statusText").textContent = t; }
function pad(n){ return (n < 10 ? "0" : "") + n; }
function baseDoc(){ return docs.filter(function(d){ return d.id === state.baseId; })[0] || docs[0]; }

/* ================= 聚焦 =================
 * state.focus 為空 = 全部顯示;有內容 = 只顯示清單內的那幾份。
 * 這只是「暫時只看某幾份」,不會移除文件,也不會動到標記或捲動位置。 */
function focusOn(){ return state.focus.length > 0; }
function isShown(d){ return !focusOn() || state.focus.indexOf(d.id) >= 0; }
function shownDocs(){ return docs.filter(isShown); }

/* 單獨放大某一份;若它已經是唯一聚焦的,再按一次就還原 */
function soloFocus(id){
  if(state.focus.length === 1 && state.focus[0] === id) state.focus = [];
  else state.focus = [id];
  applyFocus();
}
/* 加入 / 移出聚焦清單(比對其中幾份)。
 * 純切換:沒選 = 全部顯示;選了幾個就只看那幾個;全部取消又回到全部顯示。 */
function toggleFocus(id){
  var k = state.focus.indexOf(id);
  if(k >= 0) state.focus.splice(k, 1);
  else state.focus.push(id);
  // 依文件原本的順序排列,版面才不會跳來跳去
  var order = docs.map(function(d){ return d.id; });
  state.focus.sort(function(a,b){ return order.indexOf(a) - order.indexOf(b); });
  applyFocus();
}
function clearFocus(){
  if(!focusOn()) return;
  state.focus = [];
  applyFocus();
}
function applyFocus(){
  // 聚焦清單裡若有已被移除的文件,順手清掉
  state.focus = state.focus.filter(function(id){
    return docs.some(function(d){ return d.id === id; });
  });
  docs.forEach(function(d){
    if(!d.el) return;
    var on = isShown(d);
    d.el.classList.toggle("hiddenPane", !on);
    d.el.classList.toggle("focused", focusOn() && on);
    var btn = d.el.querySelector(".pfocus");
    if(btn) btn.textContent = (focusOn() && on && state.focus.length === 1) ? "⤡" : "⤢";
  });
  updateFocusBar();
  refreshGrid();
  if(state.mode === "overlay") rebuildOverlay();
  else requestAnimationFrame(function(){ relayoutAll(); syncNow(); });
}
/* 狀態列的「只看」數字鈕:兩份以上就顯示,隨時可以點開/點掉任何一份,
 * 包含目前被隱藏起來的那些——這是能挑選多份的關鍵。 */
function updateFocusBar(){
  var bar = $("focusBar");
  if(!bar) return;
  bar.hidden = docs.length < 2;
  if(bar.hidden) return;

  var box = $("focusChips");
  box.textContent = "";
  docs.forEach(function(d, i){
    var b = document.createElement("button");
    var picked = state.focus.indexOf(d.id) >= 0;
    b.className = "chipbtn" + (d.id === state.baseId ? " isbase" : "");
    b.textContent = (picked ? "✓" : "") + pad(i+1);
    b.title = (picked ? "點一下移出：" : "點一下加入：") + d.name
            + (d.id === state.baseId ? "（基準）" : "");
    b.setAttribute("aria-pressed", String(picked));
    b.addEventListener("click", function(){ toggleFocus(d.id); });
    box.appendChild(b);
  });
  $("focusAll").setAttribute("aria-pressed", String(!focusOn()));
  $("focusInfo").textContent = focusOn()
    ? ("只看 " + state.focus.length + "/" + docs.length + " 份")
    : ("全部 " + docs.length + " 份");
}

/* ================= load ================= */
function addFiles(list){
  var files = Array.prototype.slice.call(list).filter(function(f){
    return /\.pdf$/i.test(f.name) || f.type === "application/pdf";
  });
  if(!files.length){ setStatus("這些不是 PDF，換一批檔案試試。"); return; }
  var room = MAX - docs.length;
  if(files.length > room){
    setStatus("一次最多放 " + MAX + " 份，先載入前 " + room + " 份。");
    files = files.slice(0, room);
  }
  clearFocus();          // 新加入的檔案要看得到,先回到全部顯示
  files.forEach(loadOne);
}

function loadOne(file){
  var d = {
    id: ++uid, name: file.name, doc: null, sizes: [], offset: 0,
    wraps: [], tops: [], hs: [], scale: 1, io: null, el: null
  };
  docs.push(d);
  buildPane(d);
  refreshGrid();
  file.arrayBuffer().then(function(buf){
    // 保留一份原始位元組供匯出使用(pdf.js 會接管傳入的 buffer)
    d._bytes = buf.slice(0);
    return pdfjsLib.getDocument({ data: buf }).promise;
  }).then(function(pdf){
    d.doc = pdf;
    var jobs = [];
    for(var i=1;i<=pdf.numPages;i++){
      jobs.push(pdf.getPage(i).then(function(pg){
        var v = pg.getViewport({ scale:1 });
        return { w:v.width, h:v.height };
      }));
    }
    return Promise.all(jobs);
  }).then(function(sizes){
    d.sizes = sizes;
    if(state.baseId === null) setBase(d.id);
    layout(d);
    syncNow();
    refreshMeta();
  }).catch(function(err){
    console.error(err);
    d.el.querySelector(".pname").textContent = file.name + "（讀不開）";
    setStatus("「" + file.name + "」讀不開，可能有密碼保護或檔案損毀。");
  });
}

function refreshMeta(){
  var ready = docs.filter(function(d){ return d.doc; });
  updateFocusBar();                       // 檔案增減時,數字鈕要跟著重建
  if(!ready.length){ setStatus("尚未載入檔案。"); return; }
  var b = baseDoc();
  setStatus(ready.length + " 份文件 · 基準：" + (b ? b.name : "—") + (b && b.doc ? "（" + b.doc.numPages + " 頁）" : ""));
  var sel = $("diffTarget");
  sel.textContent = "";
  docs.forEach(function(d){
    if(!d.doc || d.id === state.baseId) return;
    var o = document.createElement("option");
    o.value = d.id; o.textContent = pad(docs.indexOf(d)+1) + " " + d.name;
    sel.appendChild(o);
  });
  docs.forEach(function(d, i){ d.el.querySelector(".badge").textContent = pad(i+1); });
}

/* ================= panes ================= */
function buildPane(d){
  var pane = document.createElement("div");
  pane.className = "pane";
  pane.innerHTML =
    '<div class="ph">' +
      '<button class="badge" title="設為基準檔">--</button>' +
      '<span class="pname"></span>' +
      '<span class="pind"></span>' +
      '<input class="poff" type="number" step="1" value="0" title="對頁差：這份比基準多／少幾頁">' +
      '<button class="pfocus" title="只看這一份(再按一次還原)。要挑多份請用下方狀態列的數字鈕">⤢</button>' +
      '<button class="px" title="移除">×</button>' +
    '</div>' +
    '<div class="scroll"><div class="pages"></div></div>';
  d.el = pane;
  d.scroll = pane.querySelector(".scroll");
  d.pages = pane.querySelector(".pages");
  pane.querySelector(".pname").textContent = d.name;
  pane.querySelector(".pname").title = d.name;
  pane.querySelector(".badge").addEventListener("click", function(){ setBase(d.id); });
  pane.querySelector(".px").addEventListener("click", function(){ removeDoc(d.id); });
  pane.querySelector(".pfocus").addEventListener("click", function(e){
    e.stopPropagation();
    if(e.ctrlKey || e.metaKey) toggleFocus(d.id);   // 仍支援 Ctrl 切換(看得到的窗格)
    else soloFocus(d.id);                            // 只看這一份
  });
  // 連點標題列也可以單獨放大 / 還原
  pane.querySelector(".ph").addEventListener("dblclick", function(e){
    if(e.target.closest("input,button")) return;
    soloFocus(d.id);
  });
  pane.querySelector(".poff").addEventListener("change", function(e){
    d.offset = parseInt(e.target.value, 10) || 0;
    if(state.mode === "overlay") composeAll(); else syncNow();
  });
  d.scroll.addEventListener("scroll", function(){ onScroll(d); });
  addPan(d.scroll);
  inkAttach(d);
  $("grid").appendChild(pane);
}

function addPan(el){
  var on = false, sx = 0, sy = 0, ol = 0, ot = 0;
  el.addEventListener("pointerdown", function(e){
    // 左鍵:標記模式下讓給畫筆;右鍵(或中鍵):一律用來拖曳平移
    var right = (e.button === 2 || e.button === 1);
    if(!right){
      if(e.button !== 0) return;
      if(typeof inkOn === "function" && inkOn()) return;
    }
    var r = el.getBoundingClientRect();
    if(e.clientX > r.left + el.clientWidth || e.clientY > r.top + el.clientHeight) return;
    on = true; sx = e.clientX; sy = e.clientY;
    ol = el.scrollLeft; ot = el.scrollTop;
    el.classList.add("grabbing");
    try{ el.setPointerCapture(e.pointerId); }catch(err){}
  });
  el.addEventListener("pointermove", function(e){
    if(!on) return;
    el.scrollLeft = ol - (e.clientX - sx);
    el.scrollTop = ot - (e.clientY - sy);
  });
  ["pointerup","pointercancel","pointerleave"].forEach(function(ev){
    el.addEventListener(ev, function(){ on = false; el.classList.remove("grabbing"); });
  });
  // 右鍵用來拖曳平移,因此在頁面區域內不要跳出瀏覽器選單
  el.addEventListener("contextmenu", function(e){ e.preventDefault(); });
}

function setBase(id){
  state.baseId = id;
  docs.forEach(function(d){ d.el.classList.toggle("base", d.id === id); });
  refreshMeta();
  if(state.mode === "overlay") rebuildOverlay();
}

function removeDoc(id){
  var i = docs.map(function(d){ return d.id; }).indexOf(id);
  if(i < 0) return;
  var d = docs[i];
  if(d.io) d.io.disconnect();
  d.el.remove();
  docs.splice(i, 1);
  // 一併清掉這份文件的標記歷程,避免下拉清單出現孤兒項目
  if(typeof inkHist === "object"){
    var before = inkHist.items.length;
    var removedBeforePos = 0;
    inkHist.items = inkHist.items.filter(function(it, idx){
      if(it.d === d){ if(idx < inkHist.pos) removedBeforePos++; return false; }
      return true;
    });
    if(before !== inkHist.items.length) inkHist.pos = Math.max(0, inkHist.pos - removedBeforePos);
    if(typeof updateInkButtons === "function") updateInkButtons();
  }
  if(state.baseId === id) state.baseId = docs.length ? docs[0].id : null;
  docs.forEach(function(x){ x.el.classList.toggle("base", x.id === state.baseId); });
  if(focusOn()) applyFocus();      // 移出聚焦清單並重排
  refreshGrid(); refreshMeta();
  if(state.mode === "overlay") rebuildOverlay();
}

function clearAll(){
  docs.forEach(function(d){ if(d.io) d.io.disconnect(); d.el.remove(); });
  docs = []; state.baseId = null; state.page = 1; state.focus = [];
  $("ovlGrid").textContent = "";
  // 檔案沒了,標記歷程也必須一起歸零,否則歷程清單會留下指向已移除檔案的孤兒項目
  if(typeof inkHist === "object"){
    inkHist.items = []; inkHist.pos = 0;
    inkSel = { d:null, i:-1, s:null, drag:null };
    if(typeof updateInkButtons === "function") updateInkButtons();
    if(typeof renderInkHist === "function" && !$("inkHistPop").hidden) renderInkHist();
  }
  updateFocusBar();
  refreshGrid(); refreshMeta();
}

/* ================= grid ================= */
/* 自動鋪滿:每列盡量填滿(上限 6 欄),份數除不盡時,空格一律落在最後一列(往下留空),
 * 絕不會在右側留一整欄空白。 */
function autoCols(n){
  if(n <= 1) return 1;
  var cap = 6;
  var rows = Math.ceil(n / cap);           // 需要幾列
  return Math.ceil(n / rows);              // 讓每列盡量平均、鋪滿
}
function colCount(n){
  if(state.cols === "auto") return autoCols(n);
  if(state.cols === "custom") return clamp(state.gridCols || 1, 1, 12);
  return clamp(parseInt(state.cols, 10), 1, 6);
}
function refreshGrid(){
  $("emptyState").hidden = docs.length > 0;
  // 聚焦時只按「看得到的份數」排版,版面才會真的放大
  var n = shownDocs().length;
  var cols = colCount(n);
  var g = $("grid");
  g.style.gridTemplateColumns = "repeat(" + cols + ",minmax(0,1fr))";
  // 自訂模式:同時固定列數,讓每格等高;其他模式讓列高隨內容
  if(state.cols === "custom" && state.gridRows > 0){
    g.style.gridTemplateRows = "repeat(" + clamp(state.gridRows, 1, 12) + ",minmax(0,1fr))";
    g.style.gridAutoRows = "";
  } else {
    g.style.gridTemplateRows = "";
    g.style.gridAutoRows = "minmax(0,1fr)";
  }
  var m = Math.max(1, n - 1);
  $("ovlGrid").style.gridTemplateColumns = "repeat(" + colCount(m) + ",minmax(0,1fr))";
  requestAnimationFrame(relayoutAll);
}


/* ================= render ================= */
/* 回傳第 i 頁該用的縮放比例。fit 模式:整份以最寬頁符合欄寬;手動縮放則用固定倍率。 */
function pageScale(d, i){
  if(state.zoom !== "fit") return state.zoom;
  var avail = d.scroll.clientWidth - 28;
  var maxW = 1;
  for(var k=0;k<d.sizes.length;k++) maxW = Math.max(maxW, d.sizes[k].w);
  return clamp(avail / maxW, 0.05, 5);
}

var PAD = 12, GAP = 12;

function layout(d){
  if(!d.doc || !d.sizes.length) return;
  if(d.io) d.io.disconnect();
  d.pages.textContent = "";
  d.wraps = [];
  var frag = document.createDocumentFragment();
  d.sizes.forEach(function(s, i){
    var w = document.createElement("div");
    w.className = "pg";
    w.dataset.i = i;
    w._vis = false; w._scale = 0; w._done = false; w._queued = false;
    d.wraps.push(w);
    frag.appendChild(w);
  });
  d.pages.appendChild(frag);
  d.io = new IntersectionObserver(function(entries){
    entries.forEach(function(en){
      var w = en.target;
      w._vis = en.isIntersecting;
      if(en.isIntersecting) enqueue(d, w); else clear(w);
    });
  }, { root: d.scroll, rootMargin: "60% 0px" });
  d.wraps.forEach(function(w){ d.io.observe(w); });
  applyScale(d);
}

/* resize instantly with CSS, then re-render sharp a moment later */
function applyScale(d){
  if(!d.doc || !d.wraps.length) return;
  d.scales = [];
  d.wraps.forEach(function(w, i){
    var sc = pageScale(d, i);
    d.scales[i] = sc;
    var cw = Math.round(d.sizes[i].w * sc), ch = Math.round(d.sizes[i].h * sc);
    w.style.width = cw + "px";
    w.style.height = ch + "px";
    var cv = w.querySelector("canvas");
    if(cv){ cv.style.width = cw + "px"; cv.style.height = ch + "px"; }
  });
  measure(d);
  updateInd(d);
  schedulePaint(d);
  if(typeof inkRefresh === "function") inkRefresh(d);
}

function measure(d){
  var y = PAD;
  d.tops = []; d.hs = [];
  for(var i=0;i<d.sizes.length;i++){
    var h = Math.round(d.sizes[i].h * (d.scales[i] || 1));
    d.tops.push(y); d.hs.push(h);
    y += h + GAP;
  }
}

var paintTimer;
function schedulePaint(d){
  clearTimeout(paintTimer);
  paintTimer = setTimeout(function(){
    docs.forEach(function(x){
      if(!x.doc) return;
      x.wraps.forEach(function(w){ if(w._vis) enqueue(x, w); });
    });
  }, 170);
}

/* render queue: keeps 10 panes from all rasterising at once */
var jobs = [], active = 0, MAXJOB = 3;
function enqueue(d, w){
  var i = +w.dataset.i, sc = d.scales ? d.scales[i] : 1;
  if(w._queued || (w._done && w._scale === sc)) return;
  w._queued = true;
  jobs.push({ d:d, w:w, base: d.id === state.baseId });
  pump();
}
function pump(){
  while(active < MAXJOB && jobs.length){
    jobs.sort(function(a, b){ return (b.base ? 1 : 0) - (a.base ? 1 : 0); });
    var j = jobs.shift();
    if(!j.w._vis || !j.w.isConnected){ j.w._queued = false; continue; }
    active++;
    paint(j.d, j.w).then(function(){ active--; pump(); });
  }
}

function budgetDpr(w, h){
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var area = w * h * dpr * dpr;
  var cap = 3.2e6;
  if(area > cap) dpr = Math.max(0.7, dpr * Math.sqrt(cap / area));
  return dpr;
}

function paint(d, wrap){
  var i = +wrap.dataset.i, scale = d.scales ? d.scales[i] : 1;
  return d.doc.getPage(i+1).then(function(pg){
    if((d.scales ? d.scales[i] : 1) !== scale || !wrap._vis) return;
    var vp = pg.getViewport({ scale: scale });
    var dpr = budgetDpr(vp.width, vp.height);
    var cv = document.createElement("canvas");
    cv.width = Math.max(1, Math.floor(vp.width * dpr));
    cv.height = Math.max(1, Math.floor(vp.height * dpr));
    cv.style.width = Math.round(vp.width) + "px";
    cv.style.height = Math.round(vp.height) + "px";
    var ctx = cv.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var task = pg.render({ canvasContext: ctx, viewport: vp, background: "#FFFFFF" });
    wrap._task = task;
    return task.promise.then(function(){
      if((d.scales ? d.scales[i] : 1) !== scale) return;
      var old = wrap.querySelector("canvas:not(.ink)");
      if(old) wrap.removeChild(old);
      var inkLayer = wrap.querySelector("canvas.ink");
      if(inkLayer) wrap.insertBefore(cv, inkLayer);   // 頁面畫在標記底下
      else wrap.appendChild(cv);
      wrap._done = true;
      wrap._scale = scale;
    });
  }).catch(function(){}).then(function(){
    wrap._task = null;
    wrap._queued = false;
  });
}

function clear(wrap){
  if(wrap._task){ try{ wrap._task.cancel(); }catch(e){} wrap._task = null; }
  var cv = wrap.querySelector("canvas:not(.ink)");
  if(cv) wrap.removeChild(cv);
  wrap._done = false; wrap._scale = 0;
}

function relayoutAll(){
  docs.forEach(function(d){
    if(!d.doc || !d.wraps.length) return;
    if(!isShown(d)) return;          // 被聚焦隱藏的窗格寬度為 0,跳過以免算出錯誤縮放
    var keep = posOf(d), kx = hCenter(d);
    applyScale(d);
    goTo(d, keep.i, keep.f);
    setHCenter(d, kx);
  });
  if(typeof updateZoomBox === "function") updateZoomBox();
}

/* ================= sync ================= */
function posOf(d){
  if(!d.tops.length) return { i:0, f:0 };
  var st = d.scroll.scrollTop, lo = 0, hi = d.tops.length - 1, i = 0;
  while(lo <= hi){
    var m = (lo + hi) >> 1;
    if(d.tops[m] <= st + 1){ i = m; lo = m + 1; } else hi = m - 1;
  }
  return { i:i, f: d.hs[i] ? (st - d.tops[i]) / d.hs[i] : 0 };
}
function goTo(d, i, f){
  if(!d.tops.length) return;
  i = clamp(i, 0, d.tops.length - 1);
  d.scroll.scrollTop = d.tops[i] + f * d.hs[i];
}
function hCenter(d){
  var sw = d.scroll.scrollWidth;
  return sw > 0 ? (d.scroll.scrollLeft + d.scroll.clientWidth/2) / sw : 0.5;
}
function setHCenter(d, r){
  var sw = d.scroll.scrollWidth, cw = d.scroll.clientWidth;
  if(sw <= cw) return;
  d.scroll.scrollLeft = clamp(r*sw - cw/2, 0, sw - cw);
}
function updateInd(d){
  if(!d.doc) return;
  var t = (posOf(d).i + 1) + "/" + d.doc.numPages;
  var el = d.el.querySelector(".pind");
  if(el.textContent !== t) el.textContent = t;
}

/* one pane leads, the rest follow once per frame */
var lead = null, leadT = 0, pending = null, raf = 0;
function onScroll(d){
  updateInd(d);
  if(state.mode !== "side" || !state.sync || !d.doc) return;
  var now = performance.now();
  if(lead && lead !== d && now - leadT < 160) return;
  lead = d; leadT = now; pending = d;
  if(!raf) raf = requestAnimationFrame(flushSync);
}
function flushSync(){
  raf = 0;
  var d = pending; pending = null;
  if(!d || !d.doc) return;
  var p = posOf(d), L = p.i - d.offset, rx = hCenter(d);
  docs.forEach(function(o){
    if(o === d || !o.doc) return;
    goTo(o, L + o.offset, p.f);
    setHCenter(o, rx);
    updateInd(o);
  });
  leadT = performance.now();
}

function syncNow(){
  var b = baseDoc();
  if(!b || !b.doc || state.mode !== "side" || !state.sync) return;
  lead = null;
  onScroll(b);

/* ================= overlay ================= */
function rebuildOverlay(){
  var g = $("ovlGrid");
  g.textContent = "";
  var b = baseDoc();
  docs.forEach(function(d, i){
    if(!d.doc || d.id === state.baseId || !isShown(d)){ d.cell = null; return; }
    var cell = document.createElement("div");
    cell.className = "cell";
    cell.innerHTML =
      '<div class="cellhead"><span class="badge">' + pad(i+1) + '</span>' +
      '<span class="pname"></span><span class="dpct"></span></div>' +
      '<div class="cellbody"><div class="frame" hidden><canvas></canvas></div><p class="cellnote">待疊圖</p></div>';
    cell.querySelector(".pname").textContent = d.name;
    cell.querySelector(".pname").title = d.name;
    d.cell = cell;
    g.appendChild(cell);
  });
  refreshGrid();
  if(b && b.doc) composeAll();
}

function renderTo(pdf, num, scale){
  return pdf.getPage(num).then(function(pg){
    var vp = pg.getViewport({ scale: scale });
    var cv = document.createElement("canvas");
    cv.width = Math.max(1, Math.floor(vp.width));
    cv.height = Math.max(1, Math.floor(vp.height));
    var ctx = cv.getContext("2d", { willReadFrequently:true });
    ctx.fillStyle = "#FFFFFF"; ctx.fillRect(0, 0, cv.width, cv.height);
    return pg.render({ canvasContext: ctx, viewport: vp }).promise.then(function(){ return cv; });
  });
}

function pixels(cv, W, H){
  if(cv.width === W && cv.height === H) return cv.getContext("2d", { willReadFrequently:true }).getImageData(0,0,W,H).data;
  var p = document.createElement("canvas");
  p.width = W; p.height = H;
  var c = p.getContext("2d", { willReadFrequently:true });
  c.fillStyle = "#FFFFFF"; c.fillRect(0,0,W,H);
  c.drawImage(cv, 0, 0);
  return c.getImageData(0,0,W,H).data;
}

var ovlCore = { ready:false, ex:null, view:null };
(function initOverlayCore(){
  try{
    var bin = atob(OVL_WASM_B64);
    var bytes = new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    WebAssembly.instantiate(bytes, {}).then(function(res){
      var ex = res.instance.exports;
      ovlCore.ex = ex;
      ovlCore.ptr = ex.pool_ptr();
      ovlCore.size = ex.pool_size();
      ovlCore.mem = ex.memory;
      ovlCore.ready = true;
    }).catch(function(){ ovlCore.ready = false; });
  }catch(e){ ovlCore.ready = false; }
})();

/* 用 wasm 合成一張差異影像;成功回傳 {data, changed},失敗回傳 null 由呼叫端走 JS 版 */
function composeWasm(da, db, W, H){
  if(!ovlCore.ready) return null;
  var n = W * H, need = n * 4 * 3;
  try{
    // pool 若不夠大(超大頁面),直接放棄改走 JS
    if(need > ovlCore.size) return null;
    // memory 可能因先前 grow 而 detach,每次重新取 view
    var pool = new Uint8Array(ovlCore.mem.buffer, ovlCore.ptr, ovlCore.size);
    var aOff = 0, bOff = n*4, outOff = n*8;
    pool.set(da, aOff);
    pool.set(db, bOff);
    var changed = ovlCore.ex.compose(aOff, bOff, outOff, n);
    // 複製結果出來(pool 會被下次呼叫覆寫)
    var out = new Uint8ClampedArray(n*4);
    out.set(new Uint8Array(ovlCore.mem.buffer, ovlCore.ptr + outOff, n*4));
    return { data: out, changed: changed >>> 0 };
  }catch(e){ return null; }
}

var busy = false;
function composeAll(){
  var b = baseDoc();
  if(!b || !b.doc || busy) return;
  var targets = docs.filter(function(d){ return d.doc && d.id !== state.baseId && d.cell; });
  if(!targets.length) return;
  var pb = clamp(state.page, 1, b.doc.numPages);
  state.page = pb; $("pgNum").value = pb;
  busy = true;
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var cellW = (targets[0].cell.querySelector(".cellbody").clientWidth || 320) - 24;
  var base1 = b.sizes[pb-1];
  var scale = (state.zoom === "fit" ? clamp(cellW / base1.w, 0.08, 3) : state.zoom) * dpr;

  renderTo(b.doc, pb, scale).then(function(cbase){
    var chain = Promise.resolve(), done = 0;
    targets.forEach(function(d){
      chain = chain.then(function(){
        var pt = pb - b.offset + d.offset;
        var note = d.cell.querySelector(".cellnote");
        var frame = d.cell.querySelector(".frame");
        var pct = d.cell.querySelector(".dpct");
        if(pt < 1 || pt > d.doc.numPages){
          frame.hidden = true; note.hidden = false;
          note.textContent = "沒有第 " + pt + " 頁";
          pct.textContent = "—"; pct.className = "dpct";
          return;
        }
        note.hidden = false; note.textContent = "疊圖中…";
        return renderTo(d.doc, pt, scale).then(function(cv){
          var W = Math.max(cbase.width, cv.width), H = Math.max(cbase.height, cv.height);
          var da = pixels(cbase, W, H), db = pixels(cv, W, H);
          var out = frame.querySelector("canvas");
          out.width = W; out.height = H;
          out.style.width = (W/dpr) + "px"; out.style.height = (H/dpr) + "px";
          var ctx = out.getContext("2d");
          var img = ctx.createImageData(W, H), o = img.data, changed = 0;

          var wres = composeWasm(da, db, W, H);
          if(wres){
            o.set(wres.data);
            changed = wres.changed;
          } else {
            for(var i=0;i<o.length;i+=4){
              var ia = 1 - (da[i]*0.299 + da[i+1]*0.587 + da[i+2]*0.114)/255;
              var ib = 1 - (db[i]*0.299 + db[i+1]*0.587 + db[i+2]*0.114)/255;
              var both = ia < ib ? ia : ib;
              var oa = ia - both, ob = ib - both;
              if(oa > 0.08 || ob > 0.08) changed++;
              var r = 255*(1-both*0.78), g = r, bl = r;
              r *= (1-oa*(1-214/255)); g *= (1-oa*(1-41/255)); bl *= (1-oa*(1-107/255));
              r *= (1-ob*(1-30/255)); g *= (1-ob*(1-158/255)); bl *= (1-ob*(1-201/255));
              o[i]=r; o[i+1]=g; o[i+2]=bl; o[i+3]=255;
            }
          }
          ctx.putImageData(img, 0, 0);
          frame.hidden = false; note.hidden = true;
          var p = changed / (W*H) * 100;
          pct.textContent = changed === 0 ? "相同" : (p < 0.01 ? "<0.01%" : p.toFixed(2) + "%");
          pct.className = changed === 0 ? "dpct" : "dpct hit";
          done++;
          setStatus("基準第 " + pb + " 頁 · 已疊 " + done + "/" + targets.length);
        });
      });
    });
    return chain;
  }).then(function(){
    busy = false;
    var hits = targets.filter(function(d){ var e = d.cell.querySelector(".dpct"); return e && e.classList.contains("hit"); }).length;
    setStatus("基準第 " + state.page + " 頁 · " + targets.length + " 份對照，" + (hits ? hits + " 份有差異" : "全部相同"));
  }).catch(function(err){
    console.error(err); busy = false;
    setStatus("這一頁疊不起來，換一頁試試。");
  });
}

/* ================= text diff ================= */
var TOKEN = /[\u3400-\u9FFF\u3040-\u30FF\uF900-\uFAFF]|[A-Za-z]+|[0-9]+(?:[.,][0-9]+)*|[^\s]/g;

function pageText(pdf, num){
  return pdf.getPage(num).then(function(pg){ return pg.getTextContent(); }).then(function(tc){
    return tc.items.map(function(it){ return it.str + (it.hasEOL ? "\n" : ""); }).join("");
  });
}

function diff(a, b){
  var runs = [];
  function push(t, v){
    var last = runs[runs.length-1];
    if(last && last.t === t) last.v.push(v); else runs.push({ t:t, v:[v] });
  }
  var s = 0;
  while(s < a.length && s < b.length && a[s] === b[s]) s++;
  var ea = a.length, eb = b.length;
  while(ea > s && eb > s && a[ea-1] === b[eb-1]){ ea--; eb--; }
  for(var k=0;k<s;k++) push("=", a[k]);
  var A = a.slice(s, ea), B = b.slice(s, eb), n = A.length, m = B.length;
  if(n * m > 2000000){
    for(var x=0;x<n;x++) push("-", A[x]);
    for(var y=0;y<m;y++) push("+", B[y]);
  } else if(n || m){
    var dp = new Uint32Array((n+1)*(m+1));
    for(var i=n-1;i>=0;i--){
      for(var j=m-1;j>=0;j--){
        dp[i*(m+1)+j] = A[i] === B[j] ? dp[(i+1)*(m+1)+j+1] + 1
          : Math.max(dp[(i+1)*(m+1)+j], dp[i*(m+1)+j+1]);
      }
    }
    var p = 0, q = 0;
    while(p < n && q < m){
      if(A[p] === B[q]){ push("=", A[p]); p++; q++; }
      else if(dp[(p+1)*(m+1)+q] >= dp[p*(m+1)+q+1]){ push("-", A[p]); p++; }
      else { push("+", B[q]); q++; }
    }
    while(p < n) push("-", A[p++]);
    while(q < m) push("+", B[q++]);
  }
  for(var z=ea;z<a.length;z++) push("=", a[z]);
  return runs;
}

function joinTokens(arr){
  var out = "";
  for(var i=0;i<arr.length;i++){
    if(out && /[A-Za-z0-9]$/.test(out) && /^[A-Za-z0-9]/.test(arr[i])) out += " ";
    out += arr[i];
  }
  return out;
}

function openDiff(){
  $("drawer").hidden = false;
  var b = baseDoc();
  if(!b || !b.doc){ $("diffBody").textContent = "先載入 PDF。"; return; }
  $("diffPage").value = state.mode === "overlay" ? state.page : (posOf(b).i + 1);
  runDiff();
}

function runDiff(){
  var b = baseDoc(), body = $("diffBody");
  if(!b || !b.doc){ body.textContent = "先載入 PDF。"; return; }
  var tid = parseInt($("diffTarget").value, 10);
  var t = docs.filter(function(d){ return d.id === tid; })[0];
  if(!t){ body.textContent = "選一份對照檔。"; return; }
  var pb = clamp(parseInt($("diffPage").value, 10) || 1, 1, b.doc.numPages);
  $("diffPage").value = pb;
  var pt = pb - b.offset + t.offset;
  $("diffMeta").textContent = "基準 " + pb + " ↔ " + t.name + " " + pt;
  if(pt < 1 || pt > t.doc.numPages){ body.textContent = "對照檔沒有第 " + pt + " 頁，調一下那一欄的對頁差。"; return; }
  body.textContent = "比對中…";
  Promise.all([ pageText(b.doc, pb), pageText(t.doc, pt) ]).then(function(r){
    var ta = r[0].match(TOKEN) || [], tb = r[1].match(TOKEN) || [];
    if(!ta.length && !tb.length){
      body.textContent = "這兩頁沒有可擷取的文字，多半是掃描檔。改用疊圖模式，用影像來比。";
      return;
    }
    var runs = diff(ta, tb);
    var changes = runs.filter(function(x){ return x.t !== "="; }).length;
    body.textContent = "";
    if(!changes){ body.innerHTML = '<span class="eq">這一頁文字完全相同。</span>'; return; }
    runs.forEach(function(x){
      var tag = x.t === "=" ? "span" : (x.t === "-" ? "del" : "ins");
      var el = document.createElement(tag);
      if(x.t === "=") el.className = "eq";
      el.textContent = joinTokens(x.v);
      body.appendChild(el);
      body.appendChild(document.createTextNode(" "));
    });
  }).catch(function(err){
    console.error(err);
    body.textContent = "抓不到這一頁的文字，改用疊圖模式比對。";
  });
}

/* ================= 標記 / 塗鴉 =================
 * 筆畫以「頁面正規化座標(0~1)」儲存,因此縮放、換排版、捲動重繪都不會跑掉。
 * 資料結構:d.ink[pageIndex] = [ {tool,color,size,pts:[{x,y},...]}, ... ] */
var ink = { tool:"off", color:"#FF3B30", size:3, drawing:null, seq:0, sym:"circle" };
var INK_COLORS = ["#FF3B30","#FF9500","#FFD400","#34C759","#0A84FF","#AF52DE","#111111","#FFFFFF"];
/* 可用符號:圖示、名稱 */
var INK_SYMS = [
  { id:"circle", g:"◯", name:"圈圈" },
  { id:"check",  g:"✓", name:"打勾" },
  { id:"cross",  g:"✕", name:"叉叉" },
  { id:"star",   g:"★", name:"星號" },
  { id:"excl",   g:"!", name:"驚嘆號" },
  { id:"quest",  g:"?", name:"問號" },
  { id:"tri",    g:"△", name:"三角警示" },
  { id:"dot",    g:"●", name:"實心點" }
];
/* 全域操作歷程:每畫一筆就 push,支援上一步/下一步與一次跳多步 */
var inkHist = { items:[], pos:0 };   // pos = 目前生效到第幾筆(0 表示全部復原)
/* 選取狀態:被選中的筆畫,以及拖曳中的動作 */
var inkSel = { d:null, i:-1, s:null, drag:null };

/* 取得一筆標記的邊界(正規化座標) */
function inkBounds(s){
  var xs = s.pts.map(function(p){ return p.x; });
  var ys = s.pts.map(function(p){ return p.y; });
  var b = { x0:Math.min.apply(null,xs), x1:Math.max.apply(null,xs),
            y0:Math.min.apply(null,ys), y1:Math.max.apply(null,ys) };
  // 符號單點放置時,以預設大小給一個方框(拖曳放置時就是拖出來的框)
  if(s.tool === "sym" && s.pts.length < 2){
    var r = 0.04 * Math.max(1, s.size/3);
    b = { x0:s.pts[0].x-r, x1:s.pts[0].x+r, y0:s.pts[0].y-r*1.3, y1:s.pts[0].y+r*1.3 };
  }
  // 文字方塊:依字數與行數估算範圍(供選取框使用)
  if(s.tool === "text"){
    var lines2 = String(s.text || "").split("\n");
    var longest = 0;
    lines2.forEach(function(l){ longest = Math.max(longest, l.length); });
    var fsN = (s.fsize || 16) / 800;                 // 正規化字高(以頁寬為基準)
    var wN = Math.max(0.02, longest * fsN * 0.62);
    var hN = Math.max(0.02, lines2.length * fsN * 1.35 * (s._ar || 1.3));
    b = { x0:s.pts[0].x, x1:s.pts[0].x + wN, y0:s.pts[0].y, y1:s.pts[0].y + hN };
  }
  return b;
}

/* 點擊是否落在某筆標記上(含一點容差) */
function inkHitStroke(s, x, y, tol){
  var b = inkBounds(s);
  if(x < b.x0-tol || x > b.x1+tol || y < b.y0-tol || y > b.y1+tol) return false;
  if(s.tool === "rect" || s.tool === "sym") return true;
  if(s.tool === "arrow" || s.tool === "pen" || s.tool === "hl"){
    // 逐段量點到線的距離
    for(var k=0;k<s.pts.length-1;k++){
      if(inkDistToSeg(x,y,s.pts[k],s.pts[k+1]) < tol) return true;
    }
    if(s.pts.length === 1){
      var dx=x-s.pts[0].x, dy=y-s.pts[0].y;
      return Math.sqrt(dx*dx+dy*dy) < tol;
    }
    return false;
  }
  return true;
}
function inkDistToSeg(px,py,a,b){
  var vx=b.x-a.x, vy=b.y-a.y, wx=px-a.x, wy=py-a.y;
  var L=vx*vx+vy*vy;
  var t = L > 0 ? Math.max(0, Math.min(1, (wx*vx+wy*vy)/L)) : 0;
  var dx=px-(a.x+t*vx), dy=py-(a.y+t*vy);
  return Math.sqrt(dx*dx+dy*dy);
}

/* 找出某頁最上層(最後畫的)被點到的標記 */
function inkPick(d, i, x, y){
  var arr = (d.ink && d.ink[i]) || [];
  for(var k=arr.length-1;k>=0;k--){
    var s = arr[k];
    if(s.seq > inkHist.pos) continue;         // 已被復原的不算
    if(inkHitStroke(s, x, y, 0.012)) return s;
  }
  return null;
}

/* 位移整筆標記 */
function inkMove(s, dx, dy){
  s.pts.forEach(function(p){ p.x += dx; p.y += dy; });
}
/* 以邊界框為基準縮放整筆標記 */
function inkScale(s, fx, fy, ox, oy){
  s.pts.forEach(function(p){
    p.x = ox + (p.x - ox) * fx;
    p.y = oy + (p.y - oy) * fy;
  });
}
function inkClearSel(){
  if(!inkSel.s) return;
  var d = inkSel.d, i = inkSel.i;
  inkSel = { d:null, i:-1, s:null, drag:null };
  if(d) inkRedraw(d, i);
  // 若是右鍵臨時切到選取模式,取消選取後自動回到原本的畫圖工具
  if(ink.prevTool && ink.tool === "sel"){
    ink.tool = ink.prevTool;
    ink.prevTool = null;
    syncInkToolButtons();
  }
}
function inkDeleteSel(){
  if(!inkSel.s) return;
  var d = inkSel.d, i = inkSel.i, s = inkSel.s;
  var arr = d.ink && d.ink[i];
  if(arr){
    var idx = arr.indexOf(s);
    if(idx >= 0) arr.splice(idx, 1);
  }
  // 同步移出歷程
  for(var k=0;k<inkHist.items.length;k++){
    if(inkHist.items[k].s === s){
      inkHist.items.splice(k,1);
      if(k < inkHist.pos) inkHist.pos--;
      break;
    }
  }
  // 重新編號,保持 seq 與歷程一致
  inkHist.items.forEach(function(it, n){ it.s.seq = n + 1; });
  inkSel = { d:null, i:-1, s:null, drag:null };
  inkRedraw(d, i);
  updateInkButtons();
}

function inkOn(){ return ink.tool !== "off"; }
/* 程式內切換工具時,同步工具列按鈕與游標狀態 */
function syncInkToolButtons(){
  var seg = $("inkSeg");
  if(!seg) return;
  Array.prototype.forEach.call(seg.children, function(x){
    x.setAttribute("aria-pressed", String(x.dataset.ink === ink.tool));
  });
  document.body.classList.toggle("inkmode", inkOn());
  document.body.classList.toggle("selmode", ink.tool === "sel");
  var sb = $("inkSymBtn");
  if(sb) sb.hidden = (ink.tool !== "sym");
}
function inkStore(d, i){
  if(!d.ink) d.ink = {};
  if(!d.ink[i]) d.ink[i] = [];
  return d.ink[i];
}

function inkCanvas(w){
  var c = w.querySelector("canvas.ink");
  if(!c){
    c = document.createElement("canvas");
    c.className = "ink";
    w.appendChild(c);
  }
  return c;
}

function inkRedraw(d, i){
  var w = d.wraps && d.wraps[i];
  if(!w) return;
  var strokes = (d.ink && d.ink[i]) || [];
  var cw = w.clientWidth, ch = w.clientHeight;
  if(cw < 1 || ch < 1) return;
  var drawingHere = ink.drawing && ink.drawing.d === d && ink.drawing.i === i;
  var live = strokes.filter(function(s){ return s.seq <= inkHist.pos; });
  if(!live.length && !drawingHere){
    var old = w.querySelector("canvas.ink"); if(old) old.remove();
    return;
  }
  var c = inkCanvas(w);
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  if(c.width !== Math.floor(cw*dpr) || c.height !== Math.floor(ch*dpr)){
    c.width = Math.floor(cw*dpr); c.height = Math.floor(ch*dpr);
  }
  c.style.width = cw + "px"; c.style.height = ch + "px";
  var x = c.getContext("2d");
  x.setTransform(dpr,0,0,dpr,0,0);
  x.clearRect(0,0,cw,ch);
  live.forEach(function(s){ inkDrawStroke(x, s, cw, ch); });
  if(drawingHere) inkDrawStroke(x, ink.drawing.s, cw, ch);
  // 選取框
  if(inkSel.s && inkSel.d === d && inkSel.i === i){
    var b = inkBounds(inkSel.s);
    var pad = 6;
    var bx = b.x0*cw - pad, by = b.y0*ch - pad;
    var bw = (b.x1-b.x0)*cw + pad*2, bh = (b.y1-b.y0)*ch + pad*2;
    x.save();
    x.strokeStyle = "#1E9EC9"; x.lineWidth = 1.5;
    x.setLineDash([5,4]);
    x.strokeRect(bx, by, bw, bh);
    x.setLineDash([]);
    // 右下角縮放握把
    x.fillStyle = "#1E9EC9";
    x.fillRect(bx+bw-5, by+bh-5, 10, 10);
    x.restore();
  }
}
/* 判斷點是否落在選取框的縮放握把上 */
function inkOnHandle(s, x, y, cw, ch){
  var b = inkBounds(s), pad = 6;
  var hx = b.x1*cw + pad, hy = b.y1*ch + pad;
  return Math.abs(x*cw - hx) <= 8 && Math.abs(y*ch - hy) <= 8;
}

function inkDrawStroke(x, s, cw, ch){
  var p = s.pts;
  if(!p || !p.length) return;
  x.save();
  x.lineCap = "round"; x.lineJoin = "round";
  x.strokeStyle = s.color; x.fillStyle = s.color;
  x.lineWidth = Math.max(0.5, s.size * (cw / 800));
  if(s.tool === "hl"){ x.globalAlpha = 0.35; x.lineWidth *= 5; }
  var X = function(v){ return v * cw; }, Y = function(v){ return v * ch; };

  if(s.tool === "pen" || s.tool === "hl"){
    x.beginPath();
    x.moveTo(X(p[0].x), Y(p[0].y));
    for(var k=1;k<p.length;k++) x.lineTo(X(p[k].x), Y(p[k].y));
    if(p.length === 1) x.lineTo(X(p[0].x)+0.1, Y(p[0].y));
    x.stroke();
  } else if(s.tool === "rect"){
    if(p.length < 2){ x.restore(); return; }
    var a = p[0], b = p[p.length-1];
    x.strokeRect(X(Math.min(a.x,b.x)), Y(Math.min(a.y,b.y)), Math.abs(X(b.x)-X(a.x)), Math.abs(Y(b.y)-Y(a.y)));
  } else if(s.tool === "arrow"){
    if(p.length < 2){ x.restore(); return; }
    var a2 = p[0], b2 = p[p.length-1];
    var x1=X(a2.x), y1=Y(a2.y), x2=X(b2.x), y2=Y(b2.y);
    x.beginPath(); x.moveTo(x1,y1); x.lineTo(x2,y2); x.stroke();
    var ang = Math.atan2(y2-y1, x2-x1);
    var hl = Math.max(8, x.lineWidth * 3.2);
    x.beginPath();
    x.moveTo(x2, y2);
    x.lineTo(x2 - hl*Math.cos(ang - Math.PI/7), y2 - hl*Math.sin(ang - Math.PI/7));
    x.lineTo(x2 - hl*Math.cos(ang + Math.PI/7), y2 - hl*Math.sin(ang + Math.PI/7));
    x.closePath(); x.fill();
  } else if(s.tool === "text"){
    var fs = Math.max(6, (s.fsize || 16) * (cw/800));
    x.font = fs + 'px "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif';
    x.textBaseline = "top";
    var lines = String(s.text || "").split("\n");
    var lh = fs * 1.35;
    lines.forEach(function(ln, n){
      x.fillText(ln, X(p[0].x), Y(p[0].y) + n*lh);
    });
  } else if(s.tool === "sym"){
    var a3 = p[0], b3 = p.length > 1 ? p[p.length-1] : null;
    var cx, cy, rx, ry;
    if(b3){
      // 拖曳放置:填滿拖出的方框(兩軸各自算半徑),圖形因此永遠貼合選取框
      cx = X((a3.x + b3.x)/2); cy = Y((a3.y + b3.y)/2);
      rx = Math.abs(X(b3.x) - X(a3.x))/2;
      ry = Math.abs(Y(b3.y) - Y(a3.y))/2;
    } else {
      // 單擊放置:大小與 inkBounds 的預設框一致(正規化半徑 r,y 軸 1.3 倍)
      var rN = 0.04 * Math.max(1, s.size/3);
      cx = X(a3.x); cy = Y(a3.y);
      rx = rN * cw;
      ry = rN * 1.3 * ch;
    }
    rx = Math.max(4, rx); ry = Math.max(4, ry);
    inkDrawSymbol(x, s.sym || "circle", cx, cy, rx, ry);
  }
  x.restore();
}

/* 畫出各種符號,以「中心點 + 兩軸半徑」定義,因此永遠貼合選取框 */
function inkDrawSymbol(x, id, cx, cy, rx, ry){
  var R = Math.min(rx, ry);           // 需要維持比例的細節(點、線寬)用較小者
  x.beginPath();
  if(id === "circle"){
    x.ellipse(cx, cy, rx, ry, 0, 0, Math.PI*2); x.stroke();
  } else if(id === "dot"){
    x.ellipse(cx, cy, rx, ry, 0, 0, Math.PI*2); x.fill();
  } else if(id === "cross"){
    x.moveTo(cx-rx*0.78, cy-ry*0.78); x.lineTo(cx+rx*0.78, cy+ry*0.78);
    x.moveTo(cx+rx*0.78, cy-ry*0.78); x.lineTo(cx-rx*0.78, cy+ry*0.78);
    x.stroke();
  } else if(id === "check"){
    x.moveTo(cx - rx*0.78, cy + ry*0.05);
    x.lineTo(cx - rx*0.22, cy + ry*0.64);
    x.lineTo(cx + rx*0.80, cy - ry*0.64);
    x.stroke();
  } else if(id === "star"){
    for(var k2=0;k2<5;k2++){
      var a = -Math.PI/2 + k2*2*Math.PI/5;
      var b = a + Math.PI/5;
      var px = cx + Math.cos(a)*rx,       py = cy + Math.sin(a)*ry;
      var qx = cx + Math.cos(b)*rx*0.42,  qy = cy + Math.sin(b)*ry*0.42;
      if(k2 === 0) x.moveTo(px, py); else x.lineTo(px, py);
      x.lineTo(qx, qy);
    }
    x.closePath(); x.fill();
  } else if(id === "tri"){
    x.moveTo(cx, cy - ry);
    x.lineTo(cx + rx*0.95, cy + ry*0.8);
    x.lineTo(cx - rx*0.95, cy + ry*0.8);
    x.closePath(); x.stroke();
    x.beginPath();
    x.moveTo(cx, cy - ry*0.3); x.lineTo(cx, cy + ry*0.2); x.stroke();
    x.beginPath(); x.arc(cx, cy + ry*0.48, Math.max(1, R*0.1), 0, Math.PI*2); x.fill();
  } else if(id === "excl"){
    x.lineWidth = Math.max(x.lineWidth, R*0.22);
    x.moveTo(cx, cy - ry*0.95); x.lineTo(cx, cy + ry*0.34); x.stroke();
    x.beginPath(); x.arc(cx, cy + ry*0.76, Math.max(1.5, R*0.15), 0, Math.PI*2); x.fill();
  } else if(id === "quest"){
    x.lineWidth = Math.max(x.lineWidth, R*0.2);
    x.ellipse(cx, cy - ry*0.42, rx*0.54, ry*0.42, 0, Math.PI*0.95, Math.PI*0.28, false);
    x.stroke();
    x.beginPath();
    x.moveTo(cx + rx*0.14, cy - ry*0.02); x.lineTo(cx, cy + ry*0.36); x.stroke();
    x.beginPath(); x.arc(cx - rx*0.02, cy + ry*0.74, Math.max(1.5, R*0.14), 0, Math.PI*2); x.fill();
  }
}

function inkRefresh(d){
  if(!d.wraps) return;
  for(var i=0;i<d.wraps.length;i++) inkRedraw(d, i);
}
function inkRefreshAll(){ docs.forEach(inkRefresh); }

function inkHit(d, e){
  for(var i=0;i<d.wraps.length;i++){
    var w = d.wraps[i];
    var r = w.getBoundingClientRect();
    if(r.width < 1) continue;
    if(e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom){
      return { i:i, x:(e.clientX - r.left)/r.width, y:(e.clientY - r.top)/r.height };
    }
  }
  return null;
}

/* 將一筆完成的標記寫入資料與歷程(畫筆與文字方塊共用) */
function inkCommit(d, i, s){
  if(inkHist.pos < inkHist.items.length){
    var dropped = inkHist.items.splice(inkHist.pos);
    dropped.forEach(function(it){
      var arr = it.d.ink && it.d.ink[it.i];
      if(arr){
        var idx = arr.indexOf(it.s);
        if(idx >= 0) arr.splice(idx, 1);
      }
    });
  }
  s.seq = inkHist.items.length + 1;
  inkStore(d, i).push(s);
  inkHist.items.push({ d:d, i:i, s:s });
  inkHist.pos = inkHist.items.length;
  inkRedraw(d, i);
  updateInkButtons();
}

function inkAttach(d){
  var el = d.scroll;
  el.addEventListener("pointerdown", function(e){
    if(!inkOn()) return;

    // 右鍵:點在圖形上就選取它,點在空白處則讓給平移
    if(e.button === 2){
      var hr = inkHit(d, e);
      if(!hr) return;
      var picked = inkPick(d, hr.i, hr.x, hr.y);
      if(!picked) return;                       // 空白處 → 交給 addPan 平移
      e.preventDefault(); e.stopPropagation();
      if(ink.tool !== "sel") ink.prevTool = ink.tool;   // 記住原本的畫圖工具
      ink.tool = "sel";
      syncInkToolButtons();
      inkSel = { d:d, i:hr.i, s:picked, drag:null };
      inkRedraw(d, hr.i);
      setStatus("已選取:按住左鍵可拖曳移動(可拖到別頁),拉右下角縮放,Delete 刪除。");
      return;
    }

    if(e.button !== 0) return;
    var h = inkHit(d, e);
    if(!h) return;
    e.preventDefault(); e.stopPropagation();

    // 文字方塊:點一下就輸入文字,不需拖曳
    if(ink.tool === "text"){
      var txt = prompt("輸入文字(可用 Enter 換行請改用 \\n):", "");
      if(txt === null || txt === "") return;
      var w3 = d.wraps[h.i];
      var ts = { tool:"text", color:ink.color, size:ink.size, fsize:Math.max(8, ink.size * 5),
                 text:String(txt).replace(/\\n/g, "\n"),
                 _ar: w3 ? (w3.clientWidth / Math.max(1, w3.clientHeight)) : 1.3,
                 pts:[{x:h.x, y:h.y}], seq:0 };
      inkCommit(d, h.i, ts);
      return;
    }

    if(ink.tool === "sel"){
      var w = d.wraps[h.i];
      var cw = w.clientWidth, ch = w.clientHeight;
      // 先看是不是抓在已選取項目的縮放握把上
      if(inkSel.s && inkSel.d === d && inkSel.i === h.i && inkOnHandle(inkSel.s, h.x, h.y, cw, ch)){
        var b0 = inkBounds(inkSel.s);
        inkSel.drag = { mode:"resize", ox:b0.x0, oy:b0.y0,
                        w0:Math.max(1e-4, b0.x1-b0.x0), h0:Math.max(1e-4, b0.y1-b0.y0),
                        orig: inkSel.s.pts.map(function(p){ return { x:p.x, y:p.y }; }) };
      } else {
        var picked = inkPick(d, h.i, h.x, h.y);
        if(picked){
          inkSel = { d:d, i:h.i, s:picked, drag:{ mode:"move", lx:h.x, ly:h.y } };
          setStatus("已選取:拖曳可移動,拉右下角方塊可縮放,按 Delete 刪除。");
        } else {
          inkClearSel();
          inkSel = { d:null, i:-1, s:null, drag:null };
        }
      }
      try{ el.setPointerCapture(e.pointerId); }catch(err){}
      inkRedraw(d, h.i);
      return;
    }

    ink.drawing = { d:d, i:h.i, s:{ tool:ink.tool, color:ink.color, size:ink.size, sym:ink.sym, pts:[{x:h.x,y:h.y}], seq:0 } };
    try{ el.setPointerCapture(e.pointerId); }catch(err){}
    inkRedraw(d, h.i);
  }, true);
  el.addEventListener("pointermove", function(e){
    // 選取模式:拖曳移動或縮放
    if(ink.tool === "sel" && inkSel.drag && inkSel.d === d && inkSel.s){
      var w2 = d.wraps[inkSel.i];
      if(!w2) return;
      e.preventDefault(); e.stopPropagation();
      var r2 = w2.getBoundingClientRect();
      var px = (e.clientX - r2.left)/r2.width, py = (e.clientY - r2.top)/r2.height;

      // 拖到窗格上下邊緣時自動捲動,方便把標記搬到別頁
      if(inkSel.drag.mode === "move"){
        var pr = el.getBoundingClientRect(), EDGE = 48;
        if(e.clientY < pr.top + EDGE) el.scrollTop -= 14;
        else if(e.clientY > pr.bottom - EDGE) el.scrollTop += 14;
      }
      if(inkSel.drag.mode === "move"){
        // 若游標移到同一份文件的另一頁,就把這筆標記搬過去
        var over = inkHit(d, e);
        if(over && over.i !== inkSel.i){
          var from = inkSel.i;
          var arr = d.ink && d.ink[from];
          if(arr){
            var ix = arr.indexOf(inkSel.s);
            if(ix >= 0) arr.splice(ix, 1);
          }
          inkStore(d, over.i).push(inkSel.s);
          // 歷程也指向新的頁碼
          for(var hk=0; hk<inkHist.items.length; hk++){
            if(inkHist.items[hk].s === inkSel.s){ inkHist.items[hk].i = over.i; break; }
          }
          inkSel.i = over.i;
          // 以新頁為基準重新對齊:讓標記中心落在游標處
          var bb = inkBounds(inkSel.s);
          inkMove(inkSel.s, over.x - (bb.x0+bb.x1)/2, over.y - (bb.y0+bb.y1)/2);
          inkSel.drag.lx = over.x; inkSel.drag.ly = over.y;
          inkRedraw(d, from);
          inkRedraw(d, over.i);
          if(!$("inkHistPop").hidden) renderInkHist();
          return;
        }
        inkMove(inkSel.s, px - inkSel.drag.lx, py - inkSel.drag.ly);
        inkSel.drag.lx = px; inkSel.drag.ly = py;
      } else {
        var g = inkSel.drag;
        var fx = Math.max(0.05, (px - g.ox) / g.w0);
        var fy = Math.max(0.05, (py - g.oy) / g.h0);
        if(e.shiftKey){ var f = Math.max(fx, fy); fx = f; fy = f; }   // 等比
        // 一律從「拖曳開始時的原始座標」重算,避免誤差累積
        inkSel.s.pts = g.orig.map(function(p){
          return { x: g.ox + (p.x - g.ox) * fx, y: g.oy + (p.y - g.oy) * fy };
        });
      }
      inkRedraw(d, inkSel.i);
      return;
    }
    if(!ink.drawing || ink.drawing.d !== d) return;
    var w = d.wraps[ink.drawing.i];
    if(!w) return;
    e.preventDefault(); e.stopPropagation();
    var r = w.getBoundingClientRect();
    var pt = { x:(e.clientX - r.left)/r.width, y:(e.clientY - r.top)/r.height };
    var s = ink.drawing.s;
    if(s.tool === "pen" || s.tool === "hl"){
      var last = s.pts[s.pts.length-1];
      if(Math.abs(pt.x-last.x) + Math.abs(pt.y-last.y) < 0.0015) return;
      s.pts.push(pt);
    } else {
      s.pts[1] = pt;
    }
    inkRedraw(d, ink.drawing.i);
  }, true);
  function finish(e){
    if(ink.tool === "sel"){
      if(inkSel.drag){ inkSel.drag = null; if(inkSel.d) inkRedraw(inkSel.d, inkSel.i); }
      return;
    }
    if(!ink.drawing || ink.drawing.d !== d) return;
    var s = ink.drawing.s, i = ink.drawing.i;
    ink.drawing = null;
    var keep = (s.pts.length >= 2) || (s.tool === "pen" || s.tool === "hl" || s.tool === "sym");
    if(keep) inkCommit(d, i, s);
    else { inkRedraw(d, i); updateInkButtons(); }
  }
  el.addEventListener("pointerup", finish, true);
  el.addEventListener("pointercancel", finish, true);
}

/* 歷程控制:pos 表示「目前生效到第幾筆」。改變 pos 就等於前進/後退。 */
function inkGoto(pos){
  pos = Math.max(0, Math.min(inkHist.items.length, pos));
  if(pos === inkHist.pos) return;
  inkHist.pos = pos;
  inkSel = { d:null, i:-1, s:null, drag:null };
  inkRefreshAll();
  updateInkButtons();
}
function inkUndo(){ inkGoto(inkHist.pos - 1); }
function inkRedo(){ inkGoto(inkHist.pos + 1); }

function inkClearAll(){
  docs.forEach(function(d){ d.ink = {}; });
  inkHist.items = []; inkHist.pos = 0; ink.seq = 0;
  inkSel = { d:null, i:-1, s:null, drag:null };
  inkRefreshAll();
  updateInkButtons();
}
function inkCount(){ return inkHist.items.length; }

function inkToolName(s){
  if(s.tool === "pen") return "畫筆";
  if(s.tool === "hl") return "螢光筆";
  if(s.tool === "rect") return "方框";
  if(s.tool === "arrow") return "箭頭";
  if(s.tool === "text") return "文字:" + String(s.text||"").split("\n")[0].slice(0,12);
  if(s.tool === "sym"){
    for(var k=0;k<INK_SYMS.length;k++) if(INK_SYMS[k].id === s.sym) return INK_SYMS[k].name;
    return "符號";
  }
  return "標記";
}

/* 重建歷程下拉清單 */
function renderInkHist(){
  var list = $("inkHistList"), hint = $("inkHistHint");
  list.textContent = "";
  var n = inkHist.items.length;
  if(!n){ hint.textContent = "尚無標記。"; return; }
  hint.textContent = "點任一列即可跳到該步驟(共 " + n + " 筆,目前第 " + inkHist.pos + " 筆)。";
  // 最新的排最上面
  for(var k = n - 1; k >= 0; k--){
    (function(idx){
      var it = inkHist.items[idx];
      var row = document.createElement("div");
      row.className = "histrow" + (idx + 1 > inkHist.pos ? " undone" : "");
      var docIdx = docs.indexOf(it.d) + 1;
      row.innerHTML = '<span class="hdot"></span><span class="hname"></span><span class="hidx"></span>';
      row.querySelector(".hdot").style.background = it.s.color;
      row.querySelector(".hname").textContent =
        inkToolName(it.s) + " · " + (docIdx > 0 ? pad(docIdx) : "?") + " 第 " + (it.i + 1) + " 頁";
      row.querySelector(".hidx").textContent = (idx + 1);
      row.title = "跳到第 " + (idx + 1) + " 筆";
      row.addEventListener("click", function(){ inkGoto(idx + 1); renderInkHist(); });
      list.appendChild(row);
    })(k);
  }
  // 最下面補一列「回到空白」
  var zero = document.createElement("div");
  zero.className = "histrow" + (inkHist.pos === 0 ? "" : " undone");
  zero.innerHTML = '<span class="hdot" style="background:transparent"></span><span class="hname">(空白 · 全部復原)</span><span class="hidx">0</span>';
  zero.addEventListener("click", function(){ inkGoto(0); renderInkHist(); });
  list.appendChild(zero);
}

function updateInkButtons(){
  $("inkUndo").disabled = inkHist.pos === 0;
  $("inkRedo").disabled = inkHist.pos >= inkHist.items.length;
  $("inkClear").disabled = inkHist.items.length === 0;
  if(!$("inkHistPop").hidden) renderInkHist();
}

/* ================= 匯出 PDF =================
 * 把載入的每一份文件依序接成一份 PDF,並把該頁的標記(畫筆/螢光筆/框/箭頭/符號/文字)
 * 以向量方式畫進頁面。原頁面內容保持原樣(直接複製原始頁面,不重新光柵化)。 */
function hexToRgb(hex){
  var m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex || "#FF3B30");
  if(!m) return { r:1, g:0.23, b:0.19 };
  return { r:parseInt(m[1],16)/255, g:parseInt(m[2],16)/255, b:parseInt(m[3],16)/255 };
}

async function exportPdf(){
  var ready = docs.filter(function(d){ return d.doc && d._bytes; });
  if(!ready.length){ toast("先載入 PDF"); return; }
  if(typeof PDFLib === "undefined"){ toast("PDF 元件尚未載入,稍候再試"); return; }
  var btn = $("exportPdf");
  btn.disabled = true;
  var oldLabel = btn.textContent;
  btn.textContent = "匯出中…";
  try{
    var out = await PDFLib.PDFDocument.create();
    var font = await out.embedFont(PDFLib.StandardFonts.Helvetica);
    var total = 0;

    for(var n=0; n<ready.length; n++){
      var d = ready[n];
      setStatus("匯出中:" + d.name + " (" + (n+1) + "/" + ready.length + ")");
      var src = await PDFLib.PDFDocument.load(d._bytes.slice(0), { ignoreEncryption:true });
      var idxs = src.getPageIndices();
      var copied = await out.copyPages(src, idxs);

      copied.forEach(function(pg, i){
        out.addPage(pg);
        total++;
        var strokes = ((d.ink && d.ink[i]) || []).filter(function(s){ return s.seq <= inkHist.pos; });
        if(!strokes.length) return;
        var W = pg.getWidth(), H = pg.getHeight();
        // 正規化座標 → PDF 座標(PDF 原點在左下,y 需翻轉)
        var PX = function(v){ return v * W; };
        var PY = function(v){ return H - v * H; };
        strokes.forEach(function(s){
          drawStrokeToPdf(pg, s, W, H, PX, PY, font);
        });
      });
    }

    var bytes = await out.save();
    var blob = new Blob([bytes], { type:"application/pdf" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "pdf_compare_" + stamp() + ".pdf";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 8000);
    toast("已匯出 " + ready.length + " 份、共 " + total + " 頁");
    setStatus("匯出完成:" + ready.length + " 份文件,共 " + total + " 頁。");
  }catch(err){
    console.error(err);
    toast("匯出失敗:" + (err && err.message ? err.message : "未知錯誤"));
  }finally{
    btn.disabled = false;
    btn.textContent = oldLabel;
  }
}

function drawStrokeToPdf(pg, s, W, H, PX, PY, font){
  var c = hexToRgb(s.color);
  var col = PDFLib.rgb(c.r, c.g, c.b);
  var lw = Math.max(0.5, (s.size || 3) * (W / 800));
  var p = s.pts;
  if(!p || !p.length) return;

  if(s.tool === "pen" || s.tool === "hl"){
    var w = (s.tool === "hl") ? lw * 5 : lw;
    var opa = (s.tool === "hl") ? 0.35 : 1;
    for(var k=0;k<p.length-1;k++){
      pg.drawLine({
        start:{ x:PX(p[k].x),   y:PY(p[k].y) },
        end:  { x:PX(p[k+1].x), y:PY(p[k+1].y) },
        thickness:w, color:col, opacity:opa
      });
    }
  } else if(s.tool === "rect"){
    if(p.length < 2) return;
    var a = p[0], b = p[p.length-1];
    var x0 = Math.min(PX(a.x), PX(b.x)), x1 = Math.max(PX(a.x), PX(b.x));
    var y0 = Math.min(PY(a.y), PY(b.y)), y1 = Math.max(PY(a.y), PY(b.y));
    pg.drawRectangle({ x:x0, y:y0, width:x1-x0, height:y1-y0,
                       borderColor:col, borderWidth:lw, opacity:0 });
  } else if(s.tool === "arrow"){
    if(p.length < 2) return;
    var a2 = p[0], b2 = p[p.length-1];
    var x1a = PX(a2.x), y1a = PY(a2.y), x2a = PX(b2.x), y2a = PY(b2.y);
    pg.drawLine({ start:{x:x1a,y:y1a}, end:{x:x2a,y:y2a}, thickness:lw, color:col });
    var ang = Math.atan2(y2a-y1a, x2a-x1a);
    var hl = Math.max(6, lw * 3.2);
    [ang - Math.PI/7, ang + Math.PI/7].forEach(function(t){
      pg.drawLine({ start:{x:x2a,y:y2a},
                    end:{x:x2a - hl*Math.cos(t), y:y2a - hl*Math.sin(t)},
                    thickness:lw, color:col });
    });
  } else if(s.tool === "text"){
    var fs = Math.max(6, (s.fsize || 16) * (W/800));
    var lines = String(s.text||"").split("\n");
    lines.forEach(function(ln, i){
      // 非 ASCII 字元標準字型無法輸出,以底線佔位避免整份失敗
      var safe = ln.replace(/[^\x20-\x7E]/g, "_");
      pg.drawText(safe, { x:PX(p[0].x), y:PY(p[0].y) - fs*(i+1)*1.15 + fs*0.2,
                          size:fs, font:font, color:col });
    });
  } else if(s.tool === "sym"){
    var cx, cy, rx, ry;
    if(p.length >= 2){
      var bx0=Math.min(p[0].x,p[1].x), bx1=Math.max(p[0].x,p[1].x);
      var by0=Math.min(p[0].y,p[1].y), by1=Math.max(p[0].y,p[1].y);
      cx = PX((bx0+bx1)/2); cy = PY((by0+by1)/2);
      rx = Math.abs(PX(bx1)-PX(bx0))/2; ry = Math.abs(PY(by1)-PY(by0))/2;
    } else {
      var rN = 0.04 * Math.max(1, (s.size||3)/3);
      cx = PX(p[0].x); cy = PY(p[0].y);
      rx = rN * W; ry = rN * 1.3 * H;
    }
    rx = Math.max(2, rx); ry = Math.max(2, ry);
    var id = s.sym || "circle";
    if(id === "circle"){
      pg.drawEllipse({ x:cx, y:cy, xScale:rx, yScale:ry, borderColor:col, borderWidth:lw, opacity:0 });
    } else if(id === "dot"){
      pg.drawEllipse({ x:cx, y:cy, xScale:rx, yScale:ry, color:col });
    } else if(id === "cross"){
      pg.drawLine({ start:{x:cx-rx*0.78,y:cy+ry*0.78}, end:{x:cx+rx*0.78,y:cy-ry*0.78}, thickness:lw, color:col });
      pg.drawLine({ start:{x:cx+rx*0.78,y:cy+ry*0.78}, end:{x:cx-rx*0.78,y:cy-ry*0.78}, thickness:lw, color:col });
    } else if(id === "check"){
      pg.drawLine({ start:{x:cx-rx*0.78,y:cy-ry*0.05}, end:{x:cx-rx*0.22,y:cy-ry*0.64}, thickness:lw, color:col });
      pg.drawLine({ start:{x:cx-rx*0.22,y:cy-ry*0.64}, end:{x:cx+rx*0.80,y:cy+ry*0.64}, thickness:lw, color:col });
    } else if(id === "star"){
      var pts = [];
      for(var k2=0;k2<5;k2++){
        var aa = -Math.PI/2 + k2*2*Math.PI/5, bb2 = aa + Math.PI/5;
        pts.push({x:cx+Math.cos(aa)*rx, y:cy-Math.sin(aa)*ry});
        pts.push({x:cx+Math.cos(bb2)*rx*0.42, y:cy-Math.sin(bb2)*ry*0.42});
      }
      for(var k3=0;k3<pts.length;k3++){
        var q = pts[(k3+1)%pts.length];
        pg.drawLine({ start:pts[k3], end:q, thickness:lw, color:col });
      }
    } else if(id === "tri"){
      var tp = [{x:cx,y:cy+ry},{x:cx+rx*0.95,y:cy-ry*0.8},{x:cx-rx*0.95,y:cy-ry*0.8}];
      for(var k4=0;k4<3;k4++) pg.drawLine({ start:tp[k4], end:tp[(k4+1)%3], thickness:lw, color:col });
      pg.drawLine({ start:{x:cx,y:cy+ry*0.3}, end:{x:cx,y:cy-ry*0.2}, thickness:lw, color:col });
    } else if(id === "excl"){
      pg.drawLine({ start:{x:cx,y:cy+ry*0.95}, end:{x:cx,y:cy-ry*0.34}, thickness:Math.max(lw, rx*0.22), color:col });
      pg.drawEllipse({ x:cx, y:cy-ry*0.76, xScale:Math.max(1,rx*0.15), yScale:Math.max(1,ry*0.12), color:col });
    } else if(id === "quest"){
      pg.drawEllipse({ x:cx, y:cy+ry*0.42, xScale:rx*0.54, yScale:ry*0.42, borderColor:col, borderWidth:Math.max(lw,rx*0.2), opacity:0 });
      pg.drawLine({ start:{x:cx+rx*0.14,y:cy+ry*0.02}, end:{x:cx,y:cy-ry*0.36}, thickness:Math.max(lw,rx*0.2), color:col });
      pg.drawEllipse({ x:cx, y:cy-ry*0.74, xScale:Math.max(1,rx*0.14), yScale:Math.max(1,ry*0.11), color:col });
    }
  }
}

var toastT;
function toast(msg){
  var el = $("toast");
  el.textContent = msg;
  el.hidden = false;
  clearTimeout(toastT);
  toastT = setTimeout(function(){ el.hidden = true; }, 2200);

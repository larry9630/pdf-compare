function shotCells(){
  var out = [];
  if(state.mode === "side"){
    docs.forEach(function(d, i){
      if(!d.doc || !isShown(d)) return;    // 聚焦時只截看得到的那幾份
      out.push({
        box: d.scroll,
        label: pad(i+1) + "  " + d.name + "   第 " + (posOf(d).i + 1) + " 頁",
        base: d.id === state.baseId
      });
    });
  } else {
    var b = baseDoc();
    docs.forEach(function(d, i){
      if(!d.doc || !d.cell || d.id === state.baseId) return;
      var pct = d.cell.querySelector(".dpct").textContent;
      out.push({
        box: d.cell.querySelector(".cellbody"),
        label: pad(i+1) + "  " + d.name + (pct ? "   差異 " + pct : ""),
        base: false
      });
    });
    if(out.length && b) out.unshift({ box:null, label:"基準：" + b.name + "   第 " + state.page + " 頁", base:true });
  }
  return out;
}

function shoot(){
  // 截圖時先取消選取,避免虛線選取框被拍進去
  var savedSel = inkSel.s ? { d:inkSel.d, i:inkSel.i, s:inkSel.s } : null;
  if(savedSel){
    inkSel = { d:null, i:-1, s:null, drag:null };
    inkRedraw(savedSel.d, savedSel.i);
  }
  var result = shootInner();
  if(savedSel){
    inkSel = { d:savedSel.d, i:savedSel.i, s:savedSel.s, drag:null };
    inkRedraw(savedSel.d, savedSel.i);
  }
  return result;
}
function shootInner(){
  var all = shotCells();
  var head = (all.length && !all[0].box) ? all[0].label : null;
  var cells = all.filter(function(c){ return c.box; });
  if(!cells.length) return null;
  var dpr = 2, H = 34, TOP = head ? 38 : 0;
  var cw = cells[0].box.clientWidth, ch = cells[0].box.clientHeight;
  var cols = colCount(cells.length), rows = Math.ceil(cells.length / cols);
  var W = cols * cw, HT = TOP + rows * (ch + H);
  var out = document.createElement("canvas");
  out.width = Math.floor(W * dpr); out.height = Math.floor(HT * dpr);
  var ctx = out.getContext("2d");
  ctx.scale(dpr, dpr);
  ctx.fillStyle = "#FFFFFF"; ctx.fillRect(0, 0, W, HT);
  var font = '16px "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif';
  var headFont = 'bold 17px "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif';
  ctx.textBaseline = "middle";

  if(head){
    ctx.fillStyle = "#D6296B"; ctx.fillRect(0, 0, W, TOP);
    ctx.fillStyle = "#FFFFFF"; ctx.font = headFont;
    ctx.fillText(head, 12, TOP/2 + 1);
  }

  cells.forEach(function(c, i){
    var x = (i % cols) * cw, y = TOP + Math.floor(i / cols) * (ch + H);
    ctx.fillStyle = c.base ? "#D6296B" : "#2B3542";
    ctx.fillRect(x, y, cw, H);
    ctx.save();
    ctx.beginPath(); ctx.rect(x + 9, y, cw - 18, H); ctx.clip();
    ctx.fillStyle = "#FFFFFF"; ctx.font = font;
    ctx.fillText(c.label, x + 10, y + H/2 + 1);
    ctx.restore();

    ctx.save();
    ctx.beginPath(); ctx.rect(x, y + H, cw, ch); ctx.clip();
    ctx.fillStyle = "#FFFFFF"; ctx.fillRect(x, y + H, cw, ch);
    var sr = c.box.getBoundingClientRect();
    var list = c.box.querySelectorAll("canvas");
    for(var k=0;k<list.length;k++){
      var r = list[k].getBoundingClientRect();
      if(r.width < 1 || r.height < 1) continue;
      try{
        ctx.drawImage(list[k], x + (r.left - sr.left), y + H + (r.top - sr.top), r.width, r.height);
      }catch(err){}
    }
    ctx.restore();
    ctx.strokeStyle = "#C3CCD6"; ctx.lineWidth = 1;
    ctx.strokeRect(x + 0.5, y + 0.5, cw - 1, ch + H - 1);
  });
  return out;
}

function stamp(){
  var d = new Date(), p = function(n){ return (n<10?"0":"") + n; };
  return "" + d.getFullYear() + p(d.getMonth()+1) + p(d.getDate()) + "_" + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds());
}

function saveShot(){
  var cv = shoot();
  if(!cv){ toast("目前沒有畫面可以截"); return; }
  cv.toBlob(function(b){
    var a = document.createElement("a");
    var url = URL.createObjectURL(b);
    a.href = url; a.download = "pdf_compare_" + stamp() + ".png";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 5000);
    toast("已存成 PNG");
  }, "image/png");
}

function copyShot(){
  var cv = shoot();
  if(!cv){ toast("目前沒有畫面可以截"); return; }
  if(!(window.ClipboardItem && navigator.clipboard && navigator.clipboard.write)){
    toast("這個瀏覽器不支援複製圖片，改用「存 PNG」");
    return;
  }
  cv.toBlob(function(b){
    navigator.clipboard.write([ new ClipboardItem({ "image/png": b }) ]).then(function(){
      toast("已複製到剪貼簿，可直接貼上");
    }, function(){
      toast("複製被瀏覽器擋下，改用「存 PNG」");
    });
  }, "image/png");
}

function updateGridHint(){
  var c = clamp(parseInt($("gCols").value,10)||1, 1, 12);
  var r = clamp(parseInt($("gRows").value,10)||1, 1, 12);
  var cap = c * r, n = docs.length;
  var msg = c + " 欄 × " + r + " 列 = " + cap + " 格";
  if(n > cap) msg += "  ⚠ 目前 " + n + " 份,會有 " + (n-cap) + " 份放不下";
  else if(n > 0 && n < cap) msg += "  ·  " + (cap-n) + " 格留空";
  $("gHint").textContent = msg;
}

    document.body.classList.toggle("inkmode", inkOn());
    document.body.classList.toggle("selmode", ink.tool === "sel");
    $("inkSymBtn").hidden = (ink.tool !== "sym");
    if(ink.tool !== "sym") $("inkSymPop").hidden = true;
    if(ink.tool === "sel") setStatus("選取模式:點一下標記選中,拖曳移動,拉右下角縮放,Delete 刪除。");
    else if(inkOn()) setStatus("標記模式:在頁面上拖曳即可畫。切到「關」才能拖曳平移。");
  });

  /* 符號選單 */
  var symWrap = $("inkSyms");
  INK_SYMS.forEach(function(s){
    var b = document.createElement("button");
    b.className = "symbtn";
    b.textContent = s.g;
    b.dataset.sym = s.id;
    b.title = s.name;
    b.setAttribute("aria-pressed", String(s.id === ink.sym));
    symWrap.appendChild(b);
  });
  symWrap.addEventListener("click", function(e){
    var b = e.target.closest("button");
    if(!b) return;
    ink.sym = b.dataset.sym;
    Array.prototype.forEach.call(symWrap.children, function(x){
      x.setAttribute("aria-pressed", String(x.dataset.sym === ink.sym));
    });
    $("inkSymCur").textContent = b.textContent;
    $("inkSymPop").hidden = true;
  });
  $("inkSymBtn").addEventListener("click", function(e){
    e.stopPropagation();
    var p = $("inkSymPop");
    p.hidden = !p.hidden;
    if(!p.hidden){ $("inkPop").hidden = true; $("inkHistPop").hidden = true; }
  });

  /* 歷程下拉 */
  $("inkHistBtn").addEventListener("click", function(e){
    e.stopPropagation();
    var p = $("inkHistPop");
    p.hidden = !p.hidden;
    if(!p.hidden){ $("inkPop").hidden = true; $("inkSymPop").hidden = true; renderInkHist(); }
  });

  document.addEventListener("click", function(e){
    [["inkSymPop","inkSymBtn"],["inkHistPop","inkHistBtn"]].forEach(function(pair){
      var p = $(pair[0]), b = $(pair[1]);
      if(p.hidden) return;
      if(!p.contains(e.target) && !b.contains(e.target)) p.hidden = true;
    });
  });

  $("inkUndo").addEventListener("click", function(){ inkUndo(); renderInkHist(); });
  $("inkRedo").addEventListener("click", function(){ inkRedo(); renderInkHist(); });
  $("inkClear").addEventListener("click", function(){
    var n = inkCount();
    if(!n) return;
    if(confirm("清除全部 " + n + " 筆標記?\n\nPDF 檔案會留著，只刪掉畫筆、符號與文字。")){
      inkClearAll(); renderInkHist();
      toast("已清除 " + n + " 筆標記");
    }
  });
  updateInkButtons();
})();
$("shotCopy").addEventListener("click", copyShot);
$("shotSave").addEventListener("click", saveShot);
$("exportPdf").addEventListener("click", exportPdf);
$("diffRun").addEventListener("click", runDiff);
$("diffTarget").addEventListener("change", runDiff);
$("diffPage").addEventListener("change", runDiff);
$("diffClose").addEventListener("click", function(){ $("drawer").hidden = true; });
/* 清除選單:標記與檔案分開,各自確認 */
$("clearBtn").addEventListener("click", function(e){
  e.stopPropagation();
  var p = $("clearPop");
  p.hidden = !p.hidden;
  if(!p.hidden){
    $("gridPop").hidden = true; $("inkPop").hidden = true;
    $("inkSymPop").hidden = true; $("inkHistPop").hidden = true;
    var nInk = inkCount(), nDoc = docs.length;
    $("clearInk").disabled = nInk === 0;
    $("clearFiles").disabled = nDoc === 0;
    $("clearInk").querySelector("small").innerHTML =
      nInk ? ("目前有 " + nInk + " 筆標記<br>PDF 檔案留著，繼續比對")
           : "目前沒有任何標記";
    $("clearFiles").querySelector("small").innerHTML =
      nDoc ? ("移除全部 " + nDoc + " 份 PDF，回到空白畫面<br>"
              + (nInk ? ("連同 " + nInk + " 筆標記一起消失") : "目前沒有標記"))
           : "目前沒有載入檔案";
  }
});
document.addEventListener("click", function(e){
  var p = $("clearPop");
  if(p.hidden) return;
  if(!p.contains(e.target) && !$("clearBtn").contains(e.target)) p.hidden = true;
});
$("clearInk").addEventListener("click", function(){
  $("clearPop").hidden = true;
  var n = inkCount();
  if(!n) return;
  if(confirm("清除全部 " + n + " 筆標記?\n\nPDF 檔案會留著，只刪掉畫筆、符號與文字。")){
    inkClearAll();
    if(typeof renderInkHist === "function") renderInkHist();
    toast("已清除 " + n + " 筆標記");
  }
});
$("clearFiles").addEventListener("click", function(){
  $("clearPop").hidden = true;
  var nDoc = docs.length, nInk = inkCount();
  if(!nDoc) return;
  var msg = "移除全部 " + nDoc + " 份 PDF?\n\n畫面會回到空白，要重新拖檔案進來。";
  if(nInk) msg += "\n你畫的 " + nInk + " 筆標記也會一起消失。";
  if(confirm(msg)){
    inkClearAll();
    clearAll();
    toast("已清除全部檔案");
  }
});
$("focusAll").addEventListener("click", clearFocus);

document.addEventListener("keydown", function(e){
  if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z" && !e.shiftKey){ e.preventDefault(); inkUndo(); return; }
  if((e.ctrlKey || e.metaKey) && (e.key.toLowerCase() === "y" || (e.key.toLowerCase() === "z" && e.shiftKey))){ e.preventDefault(); inkRedo(); return; }
  if((e.key === "Delete" || e.key === "Backspace") && inkSel.s){ e.preventDefault(); inkDeleteSel(); return; }
  if(e.key === "Escape" && inkSel.s){ e.preventDefault(); inkClearSel(); return; }
  if(e.key === "Escape" && focusOn()){ e.preventDefault(); clearFocus(); return; }
  if(state.mode !== "overlay") return;
  if(e.key === "ArrowRight" || e.key === "PageDown"){ state.page++; composeAll(); e.preventDefault(); }
  if(e.key === "ArrowLeft" || e.key === "PageUp"){ state.page--; composeAll(); e.preventDefault(); }
});

var rt;
window.addEventListener("resize", function(){
  clearTimeout(rt);
  rt = setTimeout(function(){
    if(state.mode === "overlay") composeAll();
    else if(state.zoom === "fit") relayoutAll();
    else docs.forEach(function(d){ if(d.doc) measure(d); });
  }, 200);
});

updateZoomBox();
if(!pdfjsLib) setStatus("PDF 元件沒載入成功——第一次開啟需要連上網路，之後就都在本機跑。");
})();
</script>
